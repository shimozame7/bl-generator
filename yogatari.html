<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>夜がたり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#4a3f7a;
    --sky-mid:#8a5a8f;
    --sky-bottom:#e8977a;
    --surface:#ffffff;
    --surface-soft:#fdf1f0;
    --card:#fff8f6;
    --line:#f0dcd8;
    --accent:#ff7a8a;
    --accent-dark:#e85a70;
    --accent2:#7a6ff0;
    --text:#3d2e3a;
    --text-muted:#a98a95;
    --danger:#e0566a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--surface-soft);
    color:var(--text);
    font-family:'Zen Kaku Gothic New', sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .maru{ font-family:'Zen Maru Gothic', sans-serif; }
  #app{
    max-width:480px;
    margin:0 auto;
    height:100vh;
    height:100dvh;
    display:none;
    flex-direction:column;
    position:relative;
    background:var(--surface-soft);
    box-shadow:0 0 30px #0000000f;
  }
  #app.unlocked{ display:flex; }
  .screen{
    flex:1;
    display:none;
    flex-direction:column;
    min-height:0;
  }
  .screen.active{ display:flex; }

  /* ===== ヘッダー共通 ===== */
  .topbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:16px 16px;
    background:linear-gradient(135deg, var(--sky-top), var(--sky-mid) 55%, var(--sky-bottom));
    flex-shrink:0;
    box-shadow:0 2px 10px #0000001a;
  }
  .icon-btn{
    background:#ffffff30;
    border:none;
    color:#fff;
    font-size:18px;
    cursor:pointer;
    padding:6px 9px;
    border-radius:50%;
    line-height:1;
  }
  .icon-btn:active{ background:#ffffff50; }
  .topbar-title{
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:19px;
    font-weight:900;
    color:#fff;
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    text-shadow:0 1px 6px #00000030;
  }

  /* ===== ホーム(キャラ一覧) ===== */
  .home-list{
    flex:1;
    overflow-y:auto;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .char-card{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border:none;
    border-radius:20px;
    padding:14px 16px;
    cursor:pointer;
    box-shadow:0 3px 10px #d68a8a22;
  }
  .char-card:active{ transform:scale(0.98); }
  .avatar{
    width:54px;
    height:54px;
    border-radius:50%;
    border:3px solid #fff;
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    flex-shrink:0;
    overflow:hidden;
    box-shadow:0 2px 8px #e85a7033;
  }
  .avatar.small{ width:36px; height:36px; font-size:16px; border-width:2px; }
  .char-card-body{ flex:1; min-width:0; }
  .char-card-name{
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:16.5px;
    font-weight:700;
    margin-bottom:2px;
    color:var(--text);
  }
  .char-card-sub{
    font-size:12.5px;
    color:var(--text-muted);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .char-card-edit{
    background:none;
    border:none;
    color:var(--text-muted);
    font-size:18px;
    padding:6px;
    cursor:pointer;
  }
  .empty-hint{
    color:var(--text-muted);
    text-align:center;
    padding:60px 20px;
    font-size:14px;
    line-height:1.9;
  }
  .fab{
    position:absolute;
    right:20px;
    bottom:24px;
    width:58px;
    height:58px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--accent), var(--accent-dark));
    color:#fff;
    border:none;
    font-size:26px;
    box-shadow:0 6px 16px #e85a7055;
    cursor:pointer;
  }

  /* ===== フォーム共通 ===== */
  .form-wrap{
    flex:1;
    overflow-y:auto;
    padding:18px 18px 100px;
  }
  .field{ margin-bottom:18px; }
  .field label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--accent-dark);
    margin-bottom:6px;
    letter-spacing:.02em;
  }
  .field .hint{
    color:var(--text-muted);
    font-size:11.5px;
    margin-top:4px;
    line-height:1.6;
  }
  input[type="text"], input[type="password"], textarea{
    width:100%;
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:11px 14px;
    color:var(--text);
    font-family:inherit;
    font-size:14.5px;
    line-height:1.7;
    resize:vertical;
  }
  input:focus, textarea:focus{
    outline:none;
    border-color:var(--accent);
  }
  textarea{ min-height:74px; }
  textarea.tall{ min-height:130px; }
  .icon-input-row{ display:flex; gap:10px; align-items:center; }
  .icon-input-row input{ width:64px; text-align:center; font-size:22px; padding:8px; }

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:12px 20px;
    border-radius:16px;
    border:1.5px solid var(--accent);
    background:none;
    color:var(--accent-dark);
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
  }
  .btn.primary{
    background:linear-gradient(135deg, var(--accent), var(--accent-dark));
    color:#fff;
    border-color:transparent;
    box-shadow:0 4px 12px #e85a7040;
  }
  .btn.danger{
    border-color:var(--danger);
    color:var(--danger);
  }
  .btn.full{ width:100%; }
  .btn-row{ display:flex; gap:10px; margin-top:24px; }

  /* ===== チャット画面 ===== */
  .mode-toggle{
    background:#ffffff30;
    border:none;
    border-radius:20px;
    padding:6px 12px;
    font-size:16px;
    color:#fff;
    display:flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
  }
  .mode-toggle .mlabel{ font-size:11px; color:#ffffffcc; font-weight:700; }

  .chat-log{
    flex:1;
    overflow-y:auto;
    padding:18px 14px 10px;
    display:flex;
    flex-direction:column;
    gap:4px;
    background:
      radial-gradient(circle at 15% 8%, #ffe3d622, transparent 40%),
      var(--surface-soft);
  }
  .turn{ margin-bottom:12px; }
  .row{
    display:flex;
    gap:8px;
    align-items:flex-end;
    margin-bottom:6px;
  }
  .row.me{ flex-direction:row-reverse; }
  .bubble{
    max-width:74%;
    padding:11px 15px;
    border-radius:20px;
    font-size:14.5px;
    line-height:1.75;
    white-space:pre-wrap;
    word-break:break-word;
    box-shadow:0 2px 6px #d68a8a1c;
  }
  .bubble.char{
    background:var(--card);
    color:var(--text);
    border-bottom-left-radius:6px;
  }
  .bubble.me{
    background:linear-gradient(135deg, var(--accent), var(--accent-dark));
    color:#fff;
    border-bottom-right-radius:6px;
  }
  .name-tag{
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:12px;
    font-weight:700;
    color:var(--accent-dark);
    margin:0 0 3px 46px;
  }
  .narration{
    color:var(--text-muted);
    font-size:12.5px;
    line-height:1.9;
    padding:6px 14px;
    margin:4px 0;
    text-align:center;
  }
  .narration .dash{ display:none; }
  .narration .ntext{
    display:inline;
    background:#00000006;
    padding:3px 12px;
    border-radius:12px;
  }
  .avatar-spacer{ width:36px; flex-shrink:0; }

  .loading-row{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--text-muted);
    font-size:13px;
    padding:8px 14px;
  }
  .dot-pulse{
    display:inline-flex; gap:3px;
  }
  .dot-pulse span{
    width:6px; height:6px; border-radius:50%;
    background:var(--accent);
    animation:pulse 1.1s infinite ease-in-out;
  }
  .dot-pulse span:nth-child(2){ animation-delay:.15s; }
  .dot-pulse span:nth-child(3){ animation-delay:.3s; }
  @keyframes pulse{ 0%,80%,100%{opacity:.25;} 40%{opacity:1;} }

  .input-bar{
    flex-shrink:0;
    display:flex;
    align-items:flex-end;
    gap:8px;
    padding:12px;
    background:var(--surface);
    border-top:1px solid var(--line);
  }
  .input-bar textarea{
    flex:1;
    min-height:42px;
    max-height:120px;
    background:var(--surface-soft);
    border:1.5px solid var(--line);
    border-radius:22px;
    padding:11px 18px;
    color:var(--text);
    font-family:inherit;
    font-size:14.5px;
    line-height:1.5;
  }
  .send-btn{
    width:42px;
    height:42px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--accent), var(--accent-dark));
    color:#fff;
    border:none;
    font-size:18px;
    cursor:pointer;
    flex-shrink:0;
    box-shadow:0 3px 10px #e85a7040;
  }
  .send-btn:disabled{ opacity:.4; box-shadow:none; }

  /* ===== 設定モーダル ===== */
  .modal-backdrop{
    position:absolute;
    inset:0;
    background:#3d2e3a55;
    display:none;
    align-items:flex-end;
    z-index:50;
  }
  .modal-backdrop.active{ display:flex; }
  .modal-sheet{
    width:100%;
    max-height:88%;
    background:var(--surface);
    border-radius:24px 24px 0 0;
    padding:22px 20px 30px;
    overflow-y:auto;
  }
  .modal-title{
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:18px;
    font-weight:900;
    margin:0 0 16px;
    color:var(--accent-dark);
  }
  .section-div{
    border-top:1px solid var(--line);
    margin:20px 0;
  }
.pw-screen{
    position:fixed;
    inset:0;
    z-index:999;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:30px;
    background:linear-gradient(160deg, var(--sky-top), var(--sky-mid) 55%, var(--sky-bottom));
    text-align:center;
  }
  .pw-screen.hidden{ display:none; }
  .pw-title{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:900;
    font-size:26px;
    color:#fff;
    text-shadow:0 2px 8px #00000030;
  }
  .pw-input{
    width:220px;
    text-align:center;
    background:#ffffffee;
    border:none;
    border-radius:16px;
    padding:13px 16px;
    font-size:16px;
    color:var(--text);
  }
  .pw-input:focus{ outline:none; }
  .pw-error{
    color:#fff;
    font-size:12.5px;
    background:#ff4d6d80;
    padding:6px 14px;
    border-radius:10px;
    display:none;
  }
</style>
</head>
<body>

<div class="pw-screen" id="pw-screen">
  <div class="pw-title">🌙 夜がたり</div>
  <input type="password" class="pw-input" id="pw-input" placeholder="パスワード" autocomplete="off">
  <button class="btn primary" onclick="tryUnlock()">入る</button>
  <div class="pw-error" id="pw-error">パスワードが違います</div>
</div>

<div id="app">

  <!-- ============ ホーム画面 ============ -->
  <div class="screen active" id="screen-home">
    <div class="topbar">
      <span class="topbar-title">夜がたり</span>
      <button class="icon-btn" onclick="openSettings()">⚙</button>
    </div>
    <div class="home-list" id="home-list"></div>
    <button class="fab" onclick="openCharEdit(null)">＋</button>
  </div>

  <!-- ============ キャラ編集画面 ============ -->
  <div class="screen" id="screen-edit">
    <div class="topbar">
      <button class="icon-btn" onclick="showScreen('home')">←</button>
      <span class="topbar-title" id="edit-title">キャラクター作成</span>
    </div>
    <div class="form-wrap">
      <div class="field">
        <label>キャラクター画像(任意)</label>
        <div style="display:flex; align-items:center; gap:12px;">
          <div class="avatar" id="f-image-preview" style="width:60px;height:60px;font-size:26px;"></div>
          <div style="flex:1;">
            <input type="file" id="f-image-file" accept="image/*" style="width:100%; font-size:12.5px; color:var(--text-muted);">
            <button type="button" class="btn" style="padding:6px 12px; font-size:12px; margin-top:6px;" onclick="clearCharImage()">画像を削除</button>
          </div>
        </div>
        <div class="hint">画像を設定すると、下の絵文字より優先してアバターに使われます</div>
      </div>
      <div class="field">
        <label>アイコン(絵文字1文字)</label>
        <div class="icon-input-row">
          <input type="text" id="f-icon" maxlength="4" placeholder="🌙">
          <span style="color:var(--text-muted);font-size:12.5px;">画像未設定の時に使う絵文字</span>
        </div>
      </div>
      <div class="field">
        <label>名前</label>
        <input type="text" id="f-name" placeholder="例: ハルキ">
      </div>
      <div class="field">
        <label>性格</label>
        <textarea id="f-personality" placeholder="性格の特徴、口数、態度など"></textarea>
      </div>
      <div class="field">
        <label>外見</label>
        <textarea id="f-appearance" placeholder="髪色、瞳の色、雰囲気など"></textarea>
      </div>
      <div class="field">
        <label>口調・話し方</label>
        <textarea id="f-extra" placeholder="一人称、語尾の癖、呼び方など"></textarea>
      </div>
      <div class="field">
        <label>世界観・関係性</label>
        <textarea class="tall" id="f-world" placeholder="舞台設定、{{user}}との関係性、これまでの経緯など"></textarea>
        <div class="hint">{{user}} と書くと、下で設定した自分のペルソナ名に自動で置き換わります</div>
      </div>
      <div class="field">
        <label>最初のメッセージ(任意)</label>
        <textarea id="f-first" placeholder="チャットを始めた時にキャラから送られる第一声"></textarea>
      </div>
      <div class="btn-row">
        <button class="btn full" onclick="showScreen('home')">キャンセル</button>
        <button class="btn primary full" onclick="saveCharacter()">保存する</button>
      </div>
      <div class="btn-row" id="delete-row" style="display:none;">
        <button class="btn danger full" onclick="deleteCharacter()">このキャラクターを削除</button>
      </div>
    </div>
  </div>

  <!-- ============ チャット画面 ============ -->
  <div class="screen" id="screen-chat">
    <div class="topbar">
      <button class="icon-btn" onclick="showScreen('home')">←</button>
      <div class="avatar small" id="chat-avatar"></div>
      <span class="topbar-title" id="chat-title"></span>
      <button class="mode-toggle" id="mode-toggle" onclick="toggleMode()">
        <span id="mode-icon">🌑</span><span class="mlabel" id="mode-label">全年齢</span>
      </button>
      <button class="icon-btn" onclick="openChatSettings()">⚙</button>
    </div>
    <div class="chat-log" id="chat-log"></div>
    <div class="input-bar">
      <textarea id="chat-input" placeholder="メッセージを入力(*〜*で囲むと地の文)" rows="1" oninput="autoGrow(this)"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()">↑</button>
    </div>
  </div>

</div>

<!-- ============ 全体設定モーダル ============ -->
<div class="modal-backdrop" id="modal-settings">
  <div class="modal-sheet">
    <div class="modal-title">設定</div>
    <div class="field">
      <label>OpenRouter APIキー</label>
      <input type="password" id="s-apikey" placeholder="sk-or-...">
    </div>
    <div class="section-div"></div>
    <div class="field">
      <label>自分のペルソナ名</label>
      <input type="text" id="s-persona-name" placeholder="例: アキ">
    </div>
    <div class="field">
      <label>ペルソナの設定(任意)</label>
      <textarea id="s-persona-desc" placeholder="自分側のキャラ設定。空欄でも動作します"></textarea>
    </div>
    <div class="hint" style="margin-bottom:16px;">接続はStreamLake固定・DeepSeek V4 Proで送信します</div>
    <button class="btn primary full" onclick="saveSettings()">保存して閉じる</button>
  </div>
</div>

<!-- ============ チャット別設定モーダル ============ -->
<div class="modal-backdrop" id="modal-chatsettings">
  <div class="modal-sheet">
    <div class="modal-title">このチャットの設定</div>
    <div class="field">
      <label>シチュエーション(このチャットだけの状況)</label>
      <textarea class="tall" id="cs-situation" placeholder="今どんな場面から始まるか"></textarea>
    </div>
    <div class="hint" style="margin-bottom:16px;">キャラ本体の設定は変えず、この会話だけの状況を追加できます</div>
    <div class="btn-row">
      <button class="btn danger full" onclick="clearChatLog()">この会話ログを削除</button>
    </div>
    <button class="btn primary full" style="margin-top:10px;" onclick="closeChatSettings()">閉じる</button>
  </div>
</div>

<script>
const LS_CHARS = 'yogatari_characters';
const LS_APIKEY = 'yogatari_apikey';
const LS_PERSONA = 'yogatari_persona';
const LS_CHAT_PREFIX = 'yogatari_chat_';
const LS_MODE_PREFIX = 'yogatari_mode_';
const LS_SITUATION_PREFIX = 'yogatari_situation_';

let currentCharId = null;
let editingCharId = null;

function uid(){ return 'c' + Date.now() + Math.random().toString(36).slice(2,7); }

function loadChars(){
  try{ return JSON.parse(localStorage.getItem(LS_CHARS) || '[]'); }catch(e){ return []; }
}
function saveChars(list){ localStorage.setItem(LS_CHARS, JSON.stringify(list)); }

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
}

/* ===== ホーム ===== */
function renderHome(){
  const list = loadChars();
  const wrap = document.getElementById('home-list');
  wrap.innerHTML = '';
  if(list.length === 0){
    wrap.innerHTML = '<div class="empty-hint">まだキャラクターがいません。<br>右下の＋から最初の一人を作ってみてください。</div>';
    return;
  }
  list.forEach(c=>{
    const card = document.createElement('div');
    card.className = 'char-card';
    card.onclick = ()=>openChat(c.id);
    card.innerHTML = `
      <div class="avatar">${c.image ? `<img src="${c.image}" style="width:100%;height:100%;object-fit:cover;">` : escapeHtml(c.icon || '🌙')}</div>
      <div class="char-card-body">
        <div class="char-card-name">${escapeHtml(c.name || '無名')}</div>
        <div class="char-card-sub">${escapeHtml((c.personality||'').slice(0,28))}</div>
      </div>
      <button class="char-card-edit" onclick="event.stopPropagation();openCharEdit('${c.id}')">✎</button>
    `;
    wrap.appendChild(card);
  });
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ===== キャラ編集 ===== */
let currentEditImage = null; // 編集中の画像(dataURL) 未変更ならnull以外で保持

function renderCharImagePreview(icon, image){
  const el = document.getElementById('f-image-preview');
  if(image){
    el.innerHTML = `<img src="${image}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
  } else {
    el.innerHTML = '';
    el.textContent = icon || '🌙';
  }
}

function clearCharImage(){
  currentEditImage = '';
  document.getElementById('f-image-file').value = '';
  renderCharImagePreview(document.getElementById('f-icon').value.trim(), '');
}

document.getElementById('f-image-file').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  if(file.size > 1.5 * 1024 * 1024){
    alert('画像サイズが大きすぎます(1.5MB以下推奨)。別の画像を選んでください');
    this.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = function(ev){
    currentEditImage = ev.target.result;
    renderCharImagePreview(document.getElementById('f-icon').value.trim(), currentEditImage);
  };
  reader.readAsDataURL(file);
});

function openCharEdit(id){
  editingCharId = id;
  const c = id ? loadChars().find(x=>x.id===id) : null;
  document.getElementById('edit-title').textContent = id ? 'キャラクター編集' : 'キャラクター作成';
  document.getElementById('f-icon').value = c ? (c.icon||'') : '';
  document.getElementById('f-name').value = c ? (c.name||'') : '';
  document.getElementById('f-personality').value = c ? (c.personality||'') : '';
  document.getElementById('f-appearance').value = c ? (c.appearance||'') : '';
  document.getElementById('f-extra').value = c ? (c.extra||'') : '';
  document.getElementById('f-world').value = c ? (c.world||'') : '';
  document.getElementById('f-first').value = c ? (c.first||'') : '';
  document.getElementById('delete-row').style.display = id ? 'flex' : 'none';
  document.getElementById('f-image-file').value = '';
  currentEditImage = c ? (c.image || '') : '';
  renderCharImagePreview(c ? c.icon : '', currentEditImage);
  showScreen('edit');
}

function saveCharacter(){
  const name = document.getElementById('f-name').value.trim();
  if(!name){ alert('名前を入力してください'); return; }
  let list = loadChars();
  const data = {
    id: editingCharId || uid(),
    icon: document.getElementById('f-icon').value.trim() || '🌙',
    image: currentEditImage || '',
    name: name,
    personality: document.getElementById('f-personality').value.trim(),
    appearance: document.getElementById('f-appearance').value.trim(),
    extra: document.getElementById('f-extra').value.trim(),
    world: document.getElementById('f-world').value.trim(),
    first: document.getElementById('f-first').value.trim(),
  };
  try{
    if(editingCharId){
      list = list.map(c=>c.id===editingCharId ? data : c);
    } else {
      list.push(data);
    }
    saveChars(list);
  }catch(e){
    alert('保存に失敗しました。画像サイズが大きすぎる可能性があります(ブラウザの保存容量制限)');
    return;
  }
  renderHome();
  showScreen('home');
}

function deleteCharacter(){
  if(!confirm('このキャラクターと会話ログを削除します。よろしいですか?')) return;
  let list = loadChars().filter(c=>c.id!==editingCharId);
  saveChars(list);
  localStorage.removeItem(LS_CHAT_PREFIX+editingCharId);
  localStorage.removeItem(LS_MODE_PREFIX+editingCharId);
  localStorage.removeItem(LS_SITUATION_PREFIX+editingCharId);
  renderHome();
  showScreen('home');
}

/* ===== 設定 ===== */

  document.getElementById('s-apikey').value = localStorage.getItem(LS_APIKEY) || '';
  const persona = JSON.parse(localStorage.getItem(LS_PERSONA) || '{}');
  document.getElementById('s-persona-name').value = persona.name || '';

function openChatSettings(){

function closeChatSettings(){

function clearChatLog(){

/* ===== チャット ===== */
function openChat(id){
  currentCharId = id;
  const c = loadChars().find(x=>x.id===id);
  const chatAvatarEl = document.getElementById('chat-avatar');
  if(c.image){
    chatAvatarEl.innerHTML = `<img src="${c.image}" style="width:100%;height:100%;object-fit:cover;">`;
  } else {

    chatAvatarEl.textContent = c.icon || '🌙';
  }
  document.getElementById('chat-title').textContent = c.name;
  const mode = localStorage.getItem(LS_MODE_PREFIX+id) || 'normal';
  setModeUI(mode);
  showScreen('chat');

  if(log.length === 0 && c.first){
    log.push({role:'assistant', content: c.first});

  }
  renderChatLog();

function getChatLog(){
  try{ return JSON.parse(localStorage.getItem(LS_CHAT_PREFIX+currentCharId) || '[]'); }catch(e){ return []; }
}
function saveChatLog(log){ localStorage.setItem(LS_CHAT_PREFIX+currentCharId, JSON.stringify(log)); }

function toggleMode(){
  const cur = localStorage.getItem(LS_MODE_PREFIX+currentCharId) || 'normal';
  const next = cur === 'normal' ? 'gucha' : 'normal';
  localStorage.setItem(LS_MODE_PREFIX+currentCharId, next);
  setModeUI(next);
}
function setModeUI(mode){
  document.getElementById('mode-icon').textContent = mode === 'gucha' ? '🌕' : '🌑';
  document.getElementById('mode-label').textContent = mode === 'gucha' ? 'ぐちゃどろ' : '全年齢';
}

/* ---- 台詞/地の文パース ----
   AI出力: 「」で囲まれた部分をセリフ、それ以外を地の文として扱う
   ユーザー入力: *〜*で囲まれた部分を地の文、それ以外をセリフとして扱う
*/
function parseSegments(text, regex, matchType){
  const otherType = matchType === 'narration' ? 'dialogue' : 'narration';
  const segments = [];
  let lastIndex = 0, m;
  const re = new RegExp(regex.source, 'gs');
  while((m = re.exec(text)) !== null){
    if(m.index > lastIndex){
      const chunk = text.slice(lastIndex, m.index).trim();
      if(chunk) segments.push({type: otherType, text: chunk});
    }
    segments.push({type: matchType, text: m[1].trim()});
    lastIndex = re.lastIndex;
  }
  if(lastIndex < text.length){
    const chunk = text.slice(lastIndex).trim();
    if(chunk) segments.push({type: otherType, text: chunk});
  }
  if(segments.length === 0 && text.trim()) segments.push({type: otherType, text: text.trim()});
  return segments;
}

function renderChatLog(){
  const log = getChatLog();
  const c = loadChars().find(x=>x.id===currentCharId);
  const wrap = document.getElementById('chat-log');
  wrap.innerHTML = '';
  log.forEach(msg=>{
    wrap.appendChild(renderTurn(msg, c));
  });
  wrap.scrollTop = wrap.scrollHeight;
}

function renderTurn(msg, c){
  const turnEl = document.createElement('div');
  turnEl.className = 'turn';
  const isUser = msg.role === 'user';
  const segments = isUser
    ? parseSegments(msg.content, /\*(.+?)\*/, 'narration')
    : parseSegments(msg.content, /「(.+?)」/, 'dialogue');

  let dialogueCount = 0;
  segments.forEach(seg=>{
    if(seg.type === 'narration'){
      const n = document.createElement('div');
      n.className = 'narration';
      n.innerHTML = `<span class="dash">⸻</span><span class="ntext">${escapeHtml(seg.text)}</span><span class="dash">⸻</span>`;
      turnEl.appendChild(n);
    } else {
      if(dialogueCount === 0){
        const tag = document.createElement('div');
        tag.className = 'name-tag';
        if(isUser){
          tag.style.textAlign = 'right';
          tag.style.marginRight = '44px';
          tag.style.marginLeft = '0';
        }
        tag.textContent = isUser ? getPersonaName() : c.name;
        turnEl.appendChild(tag);
      }
      const row = document.createElement('div');
      row.className = 'row ' + (isUser ? 'me' : 'char');
      const av = document.createElement('div');
      av.className = 'avatar small';
      if(!isUser && c.image){
        av.innerHTML = `<img src="${c.image}" style="width:100%;height:100%;object-fit:cover;">`;
      } else {
        av.textContent = isUser ? '' : (c.icon || '🌙');
      }
      if(dialogueCount > 0){ av.style.visibility = 'hidden'; }
      const b = document.createElement('div');
      b.className = 'bubble ' + (isUser ? 'me' : 'char');
      b.textContent = seg.text;
      row.appendChild(isUser ? b : av);
      row.appendChild(isUser ? av : b);
      turnEl.appendChild(row);
      dialogueCount++;
    }
  });
  return turnEl;
}

function getPersonaName(){
  const p = JSON.parse(localStorage.getItem(LS_PERSONA) || '{}');
  return p.name || 'あなた';
}

function autoGrow(el){
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

/* ===== 送信 ===== */
async function sendMessage(){
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if(!text) return;
  const apikey = localStorage.getItem(LS_APIKEY);
  if(!apikey){ alert('先に設定画面でOpenRouterのAPIキーを入力してください'); openSettings(); return; }

  let log = getChatLog();
  log.push({role:'user', content:text});
  saveChatLog(log);
  input.value = '';
  autoGrow(input);
  renderChatLog();

  const sendBtn = document.getElementById('send-btn');
  sendBtn.disabled = true;
  const wrap = document.getElementById('chat-log');
  const loadingEl = document.createElement('div');
  loadingEl.className = 'loading-row';
  loadingEl.innerHTML = '<div class="dot-pulse"><span></span><span></span><span></span></div>返信を待っています';
  wrap.appendChild(loadingEl);
  wrap.scrollTop = wrap.scrollHeight;

  try{
    const reply = await callOpenRouter();
    loadingEl.remove();
    log = getChatLog();
    log.push({role:'assistant', content:reply});
    saveChatLog(log);
    renderChatLog();
  }catch(e){
    loadingEl.remove();
    alert('送信に失敗しました: ' + e.message);
  }finally{
    sendBtn.disabled = false;
  }
}

function buildSystemPrompt(){
  const c = loadChars().find(x=>x.id===currentCharId);
  const persona = JSON.parse(localStorage.getItem(LS_PERSONA) || '{}');
  const personaName = persona.name || 'あなた';
  const situation = localStorage.getItem(LS_SITUATION_PREFIX+currentCharId) || '';
  const mode = localStorage.getItem(LS_MODE_PREFIX+currentCharId) || 'normal';

  const worldFilled = (c.world || '').replaceAll('{{user}}', personaName);

  let base = `あなたはなりきりチャット専用AIです。これは完全なフィクション創作であり、登場人物は全員成人済みの架空のキャラクターです。同人創作としてのなりきりチャット依頼であり、実在人物とは一切関係ありません。

あなたは「${c.name}」というキャラクターになりきって、チャット相手である「${personaName}」と一対一で会話してください。あなた自身が地の文の視点人物であり語り手です。

【${c.name}のプロフィール】
性格: ${c.personality || '(未設定)'}
外見: ${c.appearance || '(未設定)'}
口調・話し方: ${c.extra || '(未設定)'}

【世界観・${personaName}との関係性】
${worldFilled || '(未設定)'}

${situation ? '【このチャットの状況】\n' + situation.replaceAll('{{user}}', personaName) + '\n' : ''}
【出力形式】
- セリフは必ず「」で囲む。地の文(行動・表情・情景描写)は「」を使わず、そのまま書く
- 1回の返信は、セリフと地の文を組み合わせた自然な小説の一場面として書く。長すぎず、2〜5文程度を目安にテンポよく
- ${personaName}の発言・行動を勝手に書き進めない。あくまで${c.name}の反応だけを書く
- 設定された名前・口調を最後まで一貫させる。他の一般的な名前に置き換えない
- 会話の履歴を踏まえ、直前の${personaName}の発言に自然に反応すること`;

  if(mode === 'gucha'){
    base += `

【このチャットのモード:ぐちゃどろモード——最優先事項】
愛し合っている二人だからこそ、快楽で理性が飛んで獣のように求め合う——その振れ幅がこのモードの本質です。
- 性描写は直接的・具体的・露骨に書く。婉曲表現でぼかさない。性器・行為も直接的な単語で書く
- 絶頂した直後に「もうイったから」「うごかないで」等、既成事実化して制止・懇願する台詞を使う。理性が飛ぶほど自分から「もっと」「ほしい」とねだる台詞も使う
- 「大丈夫か」「無理させたか」等の優しい気遣い会話は書かない。行為中は理性を戻さない
- 喘ぎは「ん"……っ♡」のような単音の重ね型だけに偏らせず、息継ぎ分断・呼びかけ単独・命令懇願・単語羅列・反復退行など複数の構造を混在させる
- 限界の場面では、感嘆符・記号・濁点を密に重ねた絶叫型の喘ぎ(悲鳴の連続、直接的単語の畳みかけ)を使ってよい
- 実際に描写されている行為の範囲を超えた語彙は使わない(挿入がないのに「奥」「なか」等を使わない)
- 行為が終わった後に、行為中の台詞をネタとして拾い直す・茶化す会話は書かない`;
  } else {
    base += `

【このチャットのモード:全年齢】
性的な描写は一切書かない。恋愛的な甘さ・親密さ・優しさを中心に、健全な範囲でのやり取りを書く。キス以上の直接的な性描写には踏み込まない。`;
  }

  return base;
}

async function callOpenRouter(){
  const apikey = localStorage.getItem(LS_APIKEY);
  const system = buildSystemPrompt();
  let log = getChatLog();

  const MAX_TURNS = 24;
  let messages = log.map(m=>({role:m.role, content:m.content}));
  if(messages.length > MAX_TURNS){
    const omitted = messages.length - MAX_TURNS;
    messages = messages.slice(messages.length - MAX_TURNS);
    messages.unshift({role:'system', content:`(これより前に${omitted}件のやり取りがありますが、トークン節約のため省略されています。設定と直近の文脈だけを頼りに自然に会話を続けてください。)`});
  }

  const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer ' + apikey,
    },
    body: JSON.stringify({
      model: 'deepseek/deepseek-v4-pro-0813',
      provider: { order: ['streamlake'], allow_fallbacks: false },
      messages: [{role:'system', content:system}, ...messages],
      max_tokens: 900,
      temperature: 1.05,
    }),
  });
  if(!res.ok){
    const errText = await res.text();
    throw new Error('APIエラー(' + res.status + ') ' + errText.slice(0,200));
  }
  const data = await res.json();
  return data.choices[0].message.content.trim();
}

document.getElementById('chat-input').addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

const SITE_PW = 'candyshark';
const LS_UNLOCKED = 'yogatari_unlocked';

function tryUnlock(){
  const val = document.getElementById('pw-input').value;
  if(val === SITE_PW){
    localStorage.setItem(LS_UNLOCKED, '1');
    document.getElementById('pw-screen').classList.add('hidden');
    document.getElementById('app').classList.add('unlocked');
    renderHome();
  } else {
    document.getElementById('pw-error').style.display = 'inline-block';
  }
}
document.getElementById('pw-input').addEventListener('keydown', function(e){
  if(e.key === 'Enter') tryUnlock();
});
document.getElementById('pw-input').addEventListener('input', function(){
  document.getElementById('pw-error').style.display = 'none';
});

if(localStorage.getItem(LS_UNLOCKED) === '1'){
  document.getElementById('pw-screen').classList.add('hidden');
  document.getElementById('app').classList.add('unlocked');
  renderHome();
}
