<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>かんとぼ実験室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf1f5;
    --card:#ffffff;
    --border:#f3c7d6;
    --text:#6e2038;
    --text-sub:#a35a72;
    --accent:#d94572;
    --accent-dark:#b23359;
    --result-bg:#fff8fa;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Zen Kaku Gothic New', sans-serif;
    line-height:1.7;
  }
  .maru{ font-family:'Zen Maru Gothic', sans-serif; }
  #app{ max-width:640px; margin:0 auto; padding:0 0 60px; }
  header{
    padding:26px 20px 18px;
    text-align:center;
  }
  header h1{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:22px;
    margin:0 0 6px;
    color:var(--accent-dark);
  }
  header p{
    font-size:12.5px;
    color:var(--text-sub);
    margin:0;
  }
  .gear-btn{
    position:fixed;
    top:14px;
    right:14px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:50%;
    width:38px;
    height:38px;
    font-size:17px;
    cursor:pointer;
    color:var(--text);
    z-index:20;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    margin:0 16px 14px;
    padding:16px 16px;
  }
  .card h2{
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:15px;
    margin:0 0 12px;
    color:var(--accent-dark);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .field{ margin-bottom:12px; }
  .field:last-child{ margin-bottom:0; }
  .field label{
    display:block;
    font-size:12px;
    color:var(--text-sub);
    margin-bottom:4px;
  }
  input[type="text"], textarea, select{
    width:100%;
    background:var(--result-bg);
    border:1px solid var(--border);
    border-radius:10px;
    padding:9px 11px;
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    line-height:1.6;
    resize:vertical;
  }
  input:focus, textarea:focus, select:focus{
    outline:none;
    border-color:var(--accent);
  }
  textarea{ min-height:56px; }
  textarea.tall{ min-height:100px; }
  .row2{ display:flex; gap:10px; }
  .row2 .field{ flex:1; }
  .cb-note{
    background:#fbe4ec;
    border:1px dashed var(--accent);
    border-radius:10px;
    padding:10px 12px;
    font-size:12px;
    color:var(--accent-dark);
    line-height:1.8;
    margin-bottom:14px;
  }
  details{ margin-top:6px; }
  summary{
    cursor:pointer;
    font-size:12px;
    color:var(--text-sub);
  }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:13px 20px;
    border-radius:12px;
    border:none;
    background:var(--accent);
    color:#fff;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    width:100%;
  }
  .btn:disabled{ opacity:.5; }
  .btn.secondary{
    background:var(--card);
    color:var(--accent-dark);
    border:1px solid var(--accent);
    font-weight:500;
  }
  .btn-row{ display:flex; gap:10px; margin:0 16px 20px; }
  .btn-row .btn{ flex:1; }
  .result-card{
    background:var(--result-bg);
    border:1px solid var(--border);
    border-radius:16px;
    margin:0 16px 14px;
    padding:16px 18px;
    white-space:pre-wrap;
    font-size:14.5px;
    line-height:1.9;
    min-height:60px;
  }
  .result-meta{
    font-size:11.5px;
    color:var(--text-sub);
    margin:0 16px 8px;
    display:flex;
    justify-content:space-between;
  }
  .loading{
    text-align:center;
    color:var(--text-sub);
    font-size:13px;
    padding:20px;
  }
  .modal-backdrop{
    position:fixed;
    inset:0;
    background:#00000055;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px;
  }
  .modal-backdrop.active{ display:flex; }
  .modal-sheet{
    background:#fff;
    border-radius:16px;
    padding:20px;
    max-width:420px;
    width:100%;
    max-height:80vh;
    overflow-y:auto;
  }
  .modal-sheet h3{
    font-family:'Zen Maru Gothic', sans-serif;
    color:var(--accent-dark);
    margin:0 0 14px;
    font-size:16px;
  }
</style>
</head>
<body>
<button class="gear-btn" onclick="openSettings()">&#9881;</button>
<div id="app">
  <header>
    <h1>&#127801; かんとぼ実験室</h1>
    <p>カントボーイ専用・ぐちゃどろモード固定の実験サイト</p>
  </header>

  <div class="cb-note">
    <b>このサイトの受けは全員カントボーイです。</b><br>
    身体・人格は男性のまま、性器のみ女性器という設定で固定されています。既存のキャラJSON(攻め/受け形式)がそのまま使えます。
  </div>

  <div class="card">
    <h2>JSONインポート</h2>
    <div class="field">
      <input type="text" id="json-input" placeholder="ここにJSONを貼り付けてEnter、またはファイルを選択">
    </div>
    <input type="file" id="json-file" accept=".json" style="font-size:12px;">
  </div>

  <div class="card">
    <h2>攻めキャラクター</h2>
    <div class="field"><label>名前</label><input type="text" id="semeName"></div>
    <div class="field"><label>性格</label><textarea id="semePersonality"></textarea></div>
    <div class="field"><label>外見</label><textarea id="semeAppearance"></textarea></div>
    <div class="field"><label>口調・一人称</label><textarea id="semeExtra"></textarea></div>
    <div class="field"><label>セリフ例(任意)</label><textarea id="semeDialogue"></textarea></div>
  </div>

  <div class="card">
    <h2>受けキャラクター(カントボーイ)</h2>
    <div class="field"><label>名前</label><input type="text" id="ukeName"></div>
    <div class="field"><label>性格</label><textarea id="ukePersonality"></textarea></div>
    <div class="field"><label>外見</label><textarea id="ukeAppearance"></textarea></div>
    <div class="field"><label>口調・一人称</label><textarea id="ukeExtra"></textarea></div>
    <div class="field"><label>セリフ例(任意)</label><textarea id="ukeDialogue"></textarea></div>
    <div class="field">
      <label>性器の呼び方(固定・統一して使わせたい呼称)</label>
      <input type="text" id="genitalTerm" placeholder="例: あそこ、割れ目、蜜口 など">
    </div>
  </div>

  <div class="card">
    <h2>関係性・シチュエーション</h2>
    <div class="field"><label>関係性</label><textarea id="relationship"></textarea></div>
    <div class="field"><label>シチュエーション</label><textarea class="tall" id="situation"></textarea></div>
    <details>
      <summary>+ 詳細設定(テーマ・心情・NG等)</summary>
      <div class="field" style="margin-top:10px;"><label>テーマ</label><textarea id="theme"></textarea></div>
      <div class="field"><label>攻めの心情</label><textarea id="semeMind"></textarea></div>
      <div class="field"><label>受けの心情</label><textarea id="ukeMind"></textarea></div>
      <div class="field"><label>追加指示</label><textarea id="additionalNotes"></textarea></div>
      <div class="field"><label>スタイルNG</label><textarea id="styleNG"></textarea></div>
    </details>
  </div>

  <div class="card">
    <h2>生成設定</h2>
    <div class="row2">
      <div class="field">
        <label>視点</label>
        <select id="selectedPov">
          <option>受け一人称</option>
          <option>攻め一人称</option>
          <option>三人称</option>
        </select>
      </div>
      <div class="field">
        <label>文字数目安</label>
        <select id="selectedLength">
          <option>長め（3000〜4000字）</option>
          <option>がっつり（5000〜7000字）</option>
          <option>短め（1500〜2000字）</option>
        </select>
      </div>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn" id="gen-btn" onclick="generate()">&#10024; 生成する</button>
  </div>
  <div class="btn-row">
    <button class="btn secondary" id="continue-btn" onclick="continueGenerate()" style="display:none;">続きを書く</button>
  </div>

  <div id="result-meta-wrap"></div>
  <div id="result-wrap"></div>

</div>

<div class="modal-backdrop" id="modal-settings">
  <div class="modal-sheet">
    <h3>設定</h3>
    <div class="field">
      <label>OpenRouter APIキー</label>
      <input type="text" id="s-apikey" placeholder="sk-or-...">
    </div>
    <div class="cb-note" style="margin-top:10px;">接続はStreamLake固定・DeepSeek V4 Proで送信します</div>
    <button class="btn" onclick="saveSettings()">保存して閉じる</button>
  </div>
</div>

<script>
