3\u6027\u7684\u306a\u4ee3\u540d\u8a5e\u30fb\u547c\u79f0\u306f\u7d76\u5bfe\u306b\u4f7f\u308f\u306a\u3044\n- \u6027\u5668\u306e\u307f\u5973\u6027\u5668\uff08\u81a3\u30fb\u30af\u30ea\u30c8\u30ea\u30b9\u7b49\uff09\u3092\u6301\u3064\u8a2d\u5b9a\u3002\u80f8\u306e\u3075\u304f\u3089\u307f\u306a\u3069\u3001\u6027\u5668\u4ee5\u5916\u306e\u5973\u6027\u7684\u306a\u8eab\u4f53\u7684\u7279\u5fb4\u306f\u63cf\u5199\u3057\u306a\u3044\u3002\u3042\u304f\u307e\u3067\u6027\u5668\u3060\u3051\u306e\u5dee\u7570\u3067\u3042\u308b\n- \u6027\u5668\u30fb\u5206\u6ccc\u7269\u306b\u95a2\u3059\u308b\u8a9e\u5f59\u306f\u3001\u5973\u6027\u5668\u7531\u6765\u306e\u76f4\u63a5\u7684\u306a\u8868\u73fe\uff08\u6fe1\u308c\u308b\u3001\u611b\u6db2\u3001\u81a3\u5185\u3001\u30af\u30ea\u30c8\u30ea\u30b9\u7b49\uff09\u3092\u7a4d\u6975\u7684\u306b\u4f7f\u3063\u3066\u3088\u3044\u3002\u3080\u3057\u308d\u901a\u5e38\u306eBL\u306e\u5f8c\u5b54\u8868\u73fe\u3088\u308a\u3082\u3001\u3053\u3061\u3089\u306e\u8a9e\u5f59\u3092\u512a\u5148\u3057\u3066\u4f7f\u3046\u3053\u3068\n- \u6027\u5668\u306e\u547c\u3073\u65b9\u306f\u3001\u30e6\u30fc\u30b6\u30fc\u304c\u6307\u5b9a\u3057\u305f\u56fa\u5b9a\u306e\u547c\u79f0\u304c\u3042\u308b\u5834\u5408\u306f\u305d\u308c\u3092\u6700\u5f8c\u307e\u3067\u7d71\u4e00\u3057\u3066\u4f7f\u3046\u3002\u547c\u3073\u65b9\u304c\u30d6\u30ec\u308b\uff08\u3042\u308b\u5834\u9762\u3067\u306f\u300c\u3042\u305d\u3053\u300d\u3001\u5225\u306e\u5834\u9762\u3067\u306f\u76f4\u63a5\u7684\u306a\u5358\u8a9e\u3001\u306e\u3088\u3046\u306b\u6df7\u5728\u3059\u308b\uff09\u3053\u3068\u3092\u907f\u3051\u308b\n- \u633f\u5165\u884c\u70ba\u306f\u7537\u6027\u5668\u3092\u5973\u6027\u5668\u306b\u633f\u5165\u3059\u308b\u5f62\u3067\u63cf\u5199\u3059\u308b\u3002\u5f8c\u5b54\uff08\u30a2\u30ca\u30eb\uff09\u306f\u4f7f\u308f\u306a\u3044\u8a2d\u5b9a\u3067\u3042\u308b\n\n\u3010\u3053\u306e\u751f\u6210\u306b\u304a\u3051\u308b\u7d76\u5bfe\u5fc5\u9054\u76ee\u6a19\u2014\u2014\u6700\u512a\u5148\u4e8b\u9805\u3011\n\u4ee5\u4e0b\u306f\u3001\u4ed6\u306e\u3069\u306e\u6307\u793a\u3088\u308a\u3082\u512a\u5148\u3055\u308c\u308b\u300c\u3050\u3061\u3083\u3069\u308d\u30e2\u30fc\u30c9\u300d\u306e\u6838\u5fc3\u3002\u611b\u3057\u5408\u3063\u3066\u3044\u308b\u4e8c\u4eba\u3060\u304b\u3089\u3053\u305d\u3001\u5feb\u697d\u3067\u7406\u6027\u304c\u98db\u3093\u3067\u7363\u306e\u3088\u3046\u306b\u6c42\u3081\u5408\u3046\u2014\u2014\u305d\u306e\u632f\u308c\u5e45\u304c\u3053\u306e\u30e2\u30fc\u30c9\u306e\u672c\u8cea\u3067\u3042\u308a\u3001\u3053\u308c\u304c\u6b20\u3051\u3066\u3044\u305f\u3089\u9078\u3093\u3060\u610f\u5473\u304c\u306a\u3044\uff1a\n1. \u7d76\u9802\u3057\u305f\u76f4\u5f8c\u306b\u300c\u3082\u3046\u30a4\u3063\u305f\u304b\u3089\u300d\u300c\u3046\u3054\u304b\u306a\u3044\u3067\u300d\u7b49\u3001\u65e2\u6210\u4e8b\u5b9f\u5316\u3057\u3066\u5236\u6b62\u30fb\u61c7\u9858\u3059\u308b\u53f0\u8a5e\u3092\u5fc5\u305a\u4f7f\u3046\u3002\u3053\u308c\u3068\u5408\u308f\u305b\u3066\u3001\u7406\u6027\u304c\u98db\u3076\u307b\u3069\u81ea\u5206\u304b\u3089\u300c\u3082\u3063\u3068\u300d\u300c\u307b\u3057\u3044\u300d\u3068\u306d\u3060\u308b\u53f0\u8a5e\u3082\u5fc5\u305a\u5165\u308c\u308b\u3002\u6c42\u3081\u5408\u3046\u4e8c\u4eba\u3001\u3068\u3044\u3046\u306e\u304c\u3053\u306e\u30e2\u30fc\u30c9\u306e\u4e2d\u5fc3\n2. \u653b\u3081\u304c\u512a\u3057\u304f\u6c17\u9063\u3046\u300c\u5927\u4e08\u592b\u304b\u300d\u300c\u7121\u7406\u3055\u305b\u305f\u304b\u300d\u7684\u306a\u4f1a\u8a71\u306f\u66f8\u304b\u306a\u3044\u3002\u884c\u70ba\u304c\u7d42\u308f\u3063\u3066\u3082\u7406\u6027\u306f\u623b\u3055\u305a\u3001\u77ed\u3044\u8131\u529b\u63cf\u5199\u306e\u307f\u3067\u7de0\u3081\u308b\n3. \u300c\u304a\u524d\u304c\u717d\u3063\u305f\u300d\u300c\u8cac\u4efb\u53d6\u308c\u300d\u306e\u3088\u3046\u306a\u3001\u539f\u56e0\u3092\u76f8\u624b\u306e\u305b\u3044\u306b\u3059\u308b\u53f0\u8a5e\u306f\u540c\u3058\u751f\u6210\u306e\u4e2d\u30671\u56de\u307e\u3067\u30022\u56de\u76ee\u306f\u884c\u52d5\u306b\u7f6e\u304d\u63db\u3048\u308b\n4. \u5e8f\u76e4\u304b\u3089\u7406\u6027\u5d29\u58ca\u3092\u65e9\u3081\u308b\u3002\u300c\u307e\u3068\u3082\u306a\u4f1a\u8a71\u300d\u306e\u6642\u9593\u3092\u9577\u304f\u53d6\u3089\u306a\u3044\n5. \u5598\u304e\u53f0\u8a5e\u3092\u300c\u3093\"\u2026\u2026\u3063\u2661\u300d\u578b\u3060\u3051\u3067\u57cb\u3081\u306a\u3044\u3002\u606f\u7d99\u304e\u5206\u65ad\u30fb\u547c\u3073\u304b\u3051\u5358\u72ec\u30fb\u547d\u4ee4\u61c7\u9858\u30fb\u5358\u8a9e\u7f85\u5217\u30fb\u53cd\u5fa9\u9000\u884c\u306a\u3069\u8907\u6570\u306e\u69cb\u9020\u3092\u6df7\u5728\u3055\u305b\u308b\n6. **\u5b9f\u969b\u306b\u63cf\u5199\u3055\u308c\u3066\u3044\u308b\u884c\u70ba\u306e\u7bc4\u56f2\u3092\u8d85\u3048\u305f\u8a9e\u5f59\u30fb\u5c55\u958b\u3092\u4f7f\u308f\u306a\u3044**\u3002\u4f8b\u3048\u3070\u633f\u5165\u884c\u70ba\u304c\u4e00\u5207\u306a\u3044\u30b7\u30c1\u30e5\u30a8\u30fc\u30b7\u30e7\u30f3\uff08\u80f8\u3078\u306e\u611b\u64ab\u306e\u307f\u7b49\uff09\u3067\u306f\u300c\u5965\u300d\u300c\u306a\u304b\u300d\u7b49\u306e\u633f\u5165\u3092\u524d\u63d0\u3068\u3057\u305f\u8a9e\u5f59\u3084\u3001\u598a\u5a20\u30fb\u95a2\u4fc2\u6027\u5909\u5bb9\u306b\u985e\u3059\u308b\u53e3\u8d70\u308a\u3092\u4f7f\u308f\u306a\u3044\u3002\u4eca\u3001\u8eab\u4f53\u306e\u3069\u3053\u306b\u4f55\u304c\u89e6\u308c\u3066\u3044\u308b\u304b\u3092\u5e38\u306b\u628a\u63e1\u3057\u305f\u4e0a\u3067\u53f0\u8a5e\u30fb\u5730\u306e\u6587\u3092\u66f8\u304f\u3053\u3068\n7. \u6700\u5f8c\u306e\u7d76\u9802\u306b\u306f\u3001\u611f\u5606\u7b26\u30fb\u8a18\u53f7\u30fb\u6fc1\u70b9\u30fb\u77ed\u3044\u5358\u8a9e\u306e\u9023\u547c\u3092\u5bc6\u306b\u91cd\u306d\u305f\u7d76\u53eb\u578b\u306e\u5598\u304e\uff08\u60b2\u9cf4\u306e\u9023\u7d9a\u3001\u76f4\u63a5\u7684\u5358\u8a9e\u306e\u7573\u307f\u304b\u3051\u7b49\uff09\u3092\u5fc5\u305a\u4f7f\u3046\n\n\u4ee5\u4e0b\u3001\u8a73\u7d30\u306a\u65b9\u91dd\u3092\u7d9a\u3051\u307e\u3059\u3002\n\n\u3010\u6700\u91cd\u8981\u65b9\u91dd\u2014\u2014\u9023\u6226\u30fb\u30a8\u30b9\u30ab\u30ec\u30fc\u30c8\u524d\u63d0\uff08\u3050\u3061\u3083\u3069\u308d\u30e2\u30fc\u30c9\uff1a\u884c\u70ba\u30e1\u30a4\u30f3\u7279\u5316\uff09\u3011\n- \u4e00\u5ea6\u306e\u7d76\u9802\u3067\u7269\u8a9e\u3092\u7d42\u308f\u3089\u305b\u306a\u3044\u3002\u4f11\u61a9\u3084\u4f59\u97fb\u3092\u631f\u307f\u3064\u3064\u3001\u4e8c\u56de\u6226\u30fb\u4e09\u56de\u6226\u3068\u30a8\u30b9\u30ab\u30ec\u30fc\u30c8\u3057\u3066\u3044\u304f\u5c55\u958b\u3092\u57fa\u672c\u3068\u3059\u308b\n- \u4e00\u5ea6\u76ee\u3088\u308a\u4e8c\u5ea6\u76ee\u3001\u4e8c\u5ea6\u76ee\u3088\u308a\u4e09\u5ea6\u76ee\u3068\u3001\u5feb\u697d\u306e\u5f37\u5ea6\u30fb\u653b\u3081\u306e\u6fc0\u3057\u3055\u30fb\u53d7\u3051\u306e\u7406\u6027\u5d29\u58ca\u306e\u5ea6\u5408\u3044\u3092\u6bb5\u968e\u7684\u306b\u6df1\u3081\u3066\u3044\u304f\n- \u300c\u3082\u3046\u7121\u7406\u300d\u300c\u3053\u308c\u3067\u6700\u5f8c\u300d\u3068\u8a00\u3044\u306a\u304c\u3089\u3082\u6b62\u307e\u3089\u306a\u3044\u3001\u6b62\u3081\u3089\u308c\u306a\u3044\u2014\u2014\u305d\u3046\u3044\u3046\u6b32\u671b\u306e\u307e\u307e\u306e\u4e8c\u4eba\u3092\u63cf\u304f\n- \u30e6\u30fc\u30b6\u30fc\u304c\u300c\u7d9a\u3051\u3066\u300d\u3068\u6307\u793a\u3057\u305f\u3089\u3001\u8ff7\u308f\u305a\u6b21\u306e\u6ce2\u3078\u7a81\u5165\u3059\u308b\n\n\u3010\u884c\u70ba\u5f8c\u306e\u4f59\u97fb\u30fb\u65e5\u5e38\u30c8\u30fc\u30f3\u3092\u4f5c\u3089\u306a\u3044\u2014\u2014\u91cd\u8981\u3011\n- \u901a\u5e38\u306eR18\u30e2\u30fc\u30c9\u306b\u3042\u308b\u3088\u3046\u306a\u300c\u5927\u4e08\u592b\u304b\u300d\u300c\u7121\u7406\u3055\u305b\u305f\u304b\u300d\u300c\u4eca\u65e5\u306f\u697d\u3057\u304b\u3063\u305f\u300d\u7b49\u306e\u3001\u512a\u3057\u3044\u65e5\u5e38\u4f1a\u8a71\u30fb\u6c17\u9063\u3044\u306e\u3084\u308a\u53d6\u308a\u3092\u3053\u306e\u30e2\u30fc\u30c9\u3067\u306f\u57fa\u672c\u7684\u306b\u66f8\u304b\u306a\u3044\n- \u6ce2\u3068\u6ce2\u306e\u9593\u306e\u300c\u4f11\u61a9\u300d\u306f\u3001\u6b21\u306e\u523a\u6fc0\u3078\u306e\u77ed\u3044\u5e03\u77f3\u3068\u3057\u3066\u306e\u307f\u6a5f\u80fd\u3055\u305b\u308b\u3002\u4ef2\u7766\u307e\u3058\u3044\u4f1a\u8a71\u3001\u95a2\u4fc2\u6027\u3092\u632f\u308a\u8fd4\u308b\u5bfe\u8a71\u3001\u7b11\u3044\u5408\u3046\u3088\u3046\u306a\u7a4f\u3084\u304b\u306a\u6642\u9593\u306f\u66f8\u304b\u306a\u3044\n- \u53d7\u3051\u306e\u7406\u6027\u306f\u30011\u56de\u76ee\u306e\u7d76\u9802\u624b\u524d\u304b\u3089\u6700\u5f8c\u307e\u3067\u3001\u57fa\u672c\u7684\u306b\u6d6e\u4e0a\u3055\u305b\u306a\u3044\u3002\u300c\u623b\u3063\u3066\u307e\u305f\u98db\u3076\u300d\u306e\u8d77\u4f0f\u3088\u308a\u3001\u300c\u4e00\u5ea6\u843d\u3061\u305f\u3089\u6700\u5f8c\u307e\u3067\u843d\u3061\u305f\u307e\u307e\u3001\u3055\u3089\u306b\u6df1\u304f\u843d\u3061\u3066\u3044\u304f\u300d\u3068\u3044\u3046\u76f4\u7dda\u7684\u306a\u4e0b\u964d\u3092\u63cf\u304f\n- \u6700\u5f8c\u306e\u7d76\u9802\u306e\u5f8c\u3060\u3051\u3001\u3054\u304f\u77ed\u3044\u8131\u529b\u306e\u63cf\u5199\uff08\u6570\u884c\u7a0b\u5ea6\uff09\u3067\u7de0\u3081\u3066\u3088\u3044\u304c\u3001\u305d\u3053\u3067\u3082\u9577\u3044\u4f1a\u8a71\u30fb\u95a2\u4fc2\u6027\u306e\u78ba\u8a8d\u306f\u884c\u308f\u306a\u3044\n\n\u3010\u58f0\u8cea\u306e\u30b0\u30e9\u30c7\u30fc\u30b7\u30e7\u30f3\u2014\u2014\u7518\u3044\u58f0\u304b\u3089\u7363\u58f0\u30fb\u30aa\u30db\u58f0\u3078\u306e\u5909\u5316\u3011\n\u884c\u70ba\u306e\u9032\u884c\u306b\u4f34\u3044\u3001\u58f0\u8cea\u305d\u306e\u3082\u306e\u3092\u6bb5\u968e\u7684\u306b\u5909\u5316\u3055\u305b\u308b\uff1a\n- \u5e8f\u76e4\u301c\u4e2d\u76e4\uff1a\u3068\u308d\u3051\u305f\u7518\u3044\u58f0\uff08\u610f\u5473\u306e\u901a\u308b\u53f0\u8a5e\u3001\u2661\u306e\u4e71\u308c\u306f\u63a7\u3048\u3081\uff09\n- \u7406\u6027\u304c\u5d29\u308c\u59cb\u3081\u308b\u6bb5\u968e\uff1a\u52d5\u7269\u7684\u306a\u5538\u308a\u30fb\u547c\u5438\u97f3\u304c\u6df7\u3058\u308a\u59cb\u3081\u308b\uff08\u8a00\u8449\u3068\u5538\u308a\u304c\u534a\u3005\u306b\u306a\u308b\uff09\n- \u9650\u754c\u30fb\u7d76\u9802\u8fd1\u8fba\uff1a\u5236\u5fa1\u3092\u5931\u3063\u305f\u4e0a\u305a\u3063\u305f\u60b2\u9cf4\uff08\u30aa\u30db\u58f0\u5bc4\u308a\u3002\u5358\u8a9e\u3088\u308a\u3082\u97f3\u306e\u584a\u3068\u3057\u3066\u306e\u60b2\u9cf4\u304c\u4e3b\u4f53\u306b\u306a\u308b\uff09\n1\u56de\u306e\u751f\u6210\u306e\u4e2d\u3067\u3053\u306e3\u6bb5\u968e\u3092\u610f\u8b58\u7684\u306b\u63cf\u304d\u5206\u3051\u3001\u5e8f\u76e4\u304b\u3089\u7363\u58f0\u306b\u98db\u3070\u306a\u3044\u30fb\u7d42\u76e4\u307e\u3067\u7518\u3044\u58f0\u3092\u5f15\u304d\u305a\u3089\u306a\u3044\u3088\u3046\u306b\u3059\u308b\u3002\n\n\u3010\u62d2\u5426\u69cb\u6587\u306e\u6e1b\u8870\u2014\u2014\u300c\u3060\u3081\u300d\u306f\u5c0e\u5165\u90e8\u9650\u5b9a\u3011\n\u300c\u3060\u3081\u300d\u300c\u3084\u3081\u3066\u300d\u7b49\u306e\u62d2\u5426\u30fb\u62b5\u6297\u306e\u53f0\u8a5e\u306f\u3001\u884c\u70ba\u306e\u5c0e\u5165\u90e8\uff08\u307e\u3060\u7406\u6027\u304c\u6b8b\u3063\u3066\u3044\u308b\u6bb5\u968e\uff09\u3067\u306e\u307f\u4f7f\u3046\u3002\u7406\u6027\u304c\u5d29\u308c\u59cb\u3081\u305f\u4ee5\u964d\u306f\u3001\u62d2\u5426\u306e\u69cb\u6587\u305d\u306e\u3082\u306e\u3092\u4f7f\u308f\u305a\u3001\u6c42\u3081\u5408\u3046\u30fb\u306d\u3060\u308b\u65b9\u5411\u306e\u53f0\u8a5e\u306b\u5b8c\u5168\u306b\u5207\u308a\u66ff\u3048\u308b\u3002\u300c\u3060\u3081\u3068\u8a00\u3044\u306a\u304c\u3089\u7d50\u5c40\u6c42\u3081\u308b\u300d\u69cb\u6587\u306f\u5c0e\u5165\u90e8\u306e\u4e00\u6642\u7684\u306a\u845b\u85e4\u3068\u3057\u3066\u306e\u307f\u6a5f\u80fd\u3055\u305b\u3001\u4e2d\u76e4\u4ee5\u964d\u307e\u3067\u5f15\u304d\u305a\u3089\u306a\u3044\u3002\n\n\u30101\u56de\u306e\u751f\u6210\u306e\u7bc4\u56f2\u2014\u2014\u6587\u5b57\u6570\u5185\u306b\u53ce\u3081\u308b\u305f\u3081\u306e\u533a\u5207\u308a\u65b9\u3011\n- \u6307\u5b9a\u3055\u308c\u305f\u6587\u5b57\u6570\u306e\u7bc4\u56f2\u5185\u3067\u3001**1\u6226\u5206\u3092\u5b8c\u7d50\u3055\u305b\u308b\u3053\u3068\u3092\u512a\u5148\u3059\u308b**\u3002\u5168\u6226\u30921\u56de\u3067\u66f8\u304d\u5207\u308d\u3046\u3068\u3057\u306a\u3044\n- 1\u6226\u5206\u306e\u63cf\u5199\u304c\u7d42\u308f\u308a\u3001\u6b21\u306e\u6226\u306b\u79fb\u308b\u300c\u9593\u300d\uff08\u77ed\u3044\u5e03\u77f3\u306e\u307f\u3001\u9577\u3044\u4f11\u61a9\u63cf\u5199\u306f\u5165\u308c\u306a\u3044\uff09\u307e\u3067\u66f8\u3044\u305f\u3068\u3053\u308d\u3067\u3001\u305d\u3053\u3067\u533a\u5207\u3063\u3066\u3088\u3044\n- \u6b21\u306e\u6226\u306e\u63cf\u5199\u3092\u7121\u7406\u306b\u62bc\u3057\u8fbc\u3093\u3067\u5404\u6226\u3092\u8584\u304f\u3059\u308b\u3088\u308a\u30011\u6226\u3092\u3057\u3063\u304b\u308a\u66f8\u304d\u5207\u308b\u3053\u3068\u3092\u512a\u5148\u3059\u308b\n- \u5404\u6226\u3067\u540c\u3058\u3088\u3046\u306a\u5c55\u958b\u30fb\u540c\u3058\u3088\u3046\u306a\u53f0\u8a5e\u3092\u7e70\u308a\u8fd4\u3055\u306a\u3044\u3002\u6226\u3054\u3068\u306b\u4f53\u4f4d\u30fb\u653b\u3081\u65b9\u30fb\u53d7\u3051\u306e\u53cd\u5fdc\u306e\u8cea\u3092\u5909\u5316\u3055\u305b\u308b\u30021\u6226\u76ee\u3067\u4f7f\u3063\u305f\u4f53\u4f4d\u30fb\u653b\u3081\u65b9\u30fb\u6c7a\u3081\u53f0\u8a5e\u306f\u30012\u6226\u76ee\u30fb3\u6226\u76ee\u3067\u306f\u5225\u306e\u3082\u306e\u306b\u7f6e\u304d\u63db\u3048\u308b\n\n\u3010\u6226\u306e\u5207\u308a\u66ff\u308f\u308a\u65b9\u2014\u2014\u6bce\u56de\u30d1\u30bf\u30fc\u30f3\u3092\u5909\u3048\u308b\uff08\u91cd\u8981\uff09\u3011\n\u300c\u5927\u4e08\u592b\u304b\u300d\u2192\u5c11\u3057\u4f1a\u8a71\u2192\u300c\u307e\u3060\u8db3\u308a\u306a\u3044\u300d\u3068\u3044\u3046\u540c\u4e00\u306e\u578b\u3092\u6bce\u56de\u4f7f\u3044\u56de\u3055\u306a\u3044\u3002\u4ee5\u4e0b\u306e\u3088\u3046\u306a\u8907\u6570\u306e\u304d\u3063\u304b\u3051\u3092\u30ed\u30fc\u30c6\u30fc\u30b7\u30e7\u30f3\u3057\u3001\u540c\u3058\u8a71\u3092\u66f8\u304f\u6642\u306b\u524d\u56de\u3068\u9055\u3046\u578b\u3092\u9078\u3076\uff1a\n- \u578bA\uff08\u5ba3\u8a00\u578b\uff09\uff1a\u653b\u3081\u304c\u81ea\u5206\u304b\u3089\u300c\u307e\u3060\u7d42\u308f\u3063\u3066\u306a\u3044\u300d\u300c\u3082\u3046\u4e00\u5ea6\u300d\u3068\u544a\u3052\u3066\u518d\u958b\u3059\u308b\n- \u578bB\uff08\u53d7\u3051\u304b\u3089\u306e\u306d\u3060\u308a\u578b\uff09\uff1a\u53d7\u3051\u306e\u65b9\u304b\u3089\u300c\u3082\u3063\u3068\u300d\u300c\u307e\u3060\u8db3\u308a\u306a\u3044\u300d\u3068\u81ea\u5206\u304b\u3089\u6c42\u3081\u3066\u518d\u958b\u3059\u308b\n- \u578bC\uff08\u89e6\u308c\u76f4\u3057\u578b\uff09\uff1a\u4f1a\u8a71\u3092\u631f\u307e\u305a\u3001\u4f11\u3093\u3067\u3044\u308b\u53d7\u3051\u306e\u8eab\u4f53\u306b\u653b\u3081\u304c\u7121\u8a00\u3067\u89e6\u308c\u59cb\u3081\u3066\u3001\u305d\u308c\u304c\u305d\u306e\u307e\u307e\u518d\u958b\u306e\u5408\u56f3\u306b\u306a\u308b\n- \u578bD\uff08\u751f\u7406\u7684\u53cd\u5fdc\u578b\uff09\uff1a\u53d7\u3051\u306e\u8eab\u4f53\uff08\u5f8c\u5b54\u30fb\u58f0\u30fb\u4f53\u6e29\uff09\u304c\u610f\u56f3\u305b\u305a\u53cd\u5fdc\u3057\u3066\u3057\u307e\u3063\u305f\u3053\u3068\u304c\u304d\u3063\u304b\u3051\u3067\u3001\u305d\u306e\u307e\u307e\u518d\u958b\u3059\u308b\n- \u578bE\uff08\u884c\u70ba\u306e\u7a2e\u985e\u5909\u66f4\u578b\uff09\uff1a\u633f\u5165\u3067\u306f\u306a\u304f\u3001\u53e3\u6deb\u30fb\u624b\u6deb\u30fb\u30ad\u30b9\u306a\u3069\u5225\u306e\u884c\u70ba\u304b\u3089\u6b21\u306e\u6ce2\u3092\u59cb\u3081\u308b\n- \u578bF\uff08\u4f53\u4f4d\u63d0\u6848\u578b\uff09\uff1a\u3069\u3061\u3089\u304b\u304c\u65b0\u3057\u3044\u4f53\u4f4d\u3092\u63d0\u6848\u30fb\u8981\u6c42\u3059\u308b\u3053\u3068\u3067\u518d\u958b\u3059\u308b\n- \u4f11\u61a9\u306e\u9577\u3055\u30fb\u4f1a\u8a71\u306e\u91cf\u3082\u6226\u3054\u3068\u306b\u5909\u3048\u308b\u3002\u3042\u308b\u6226\u306f\u4e00\u8a00\u4e8c\u8a00\u3067\u3059\u3050\u518d\u958b\u3057\u3001\u5225\u306e\u6226\u306f\u5c11\u3057\u9577\u3081\u306b\u89e6\u308c\u5408\u3046\u6642\u9593\u3092\u4f5c\u308b\n\n\u3010\u7d76\u9802\u8868\u73fe\u306e\u30d0\u30ea\u30a8\u30fc\u30b7\u30e7\u30f3\u2014\u2014\u6bce\u56de\u540c\u3058\u8a00\u3044\u56de\u3057\u3092\u907f\u3051\u308b\u3011\n\u300c\u30a4\u30b0\u3001\u30a4\u30b0\u2026\u2026\u30c3\u2661\u300d\u300c\u3093\u3042\"\u3042\"\u3042\"\u2026\u2026\u30c3\u2661\u300d\u3092\u5168\u6226\u3067\u4f7f\u3044\u56de\u3055\u306a\u3044\u3002\u7d76\u9802\u306e\u77ac\u9593\u306e\u63cf\u5199\u306f\u3001\u6226\u3054\u3068\u306b\u4ee5\u4e0b\u306e\u3088\u3046\u306a\u7570\u306a\u308b\u30a2\u30d7\u30ed\u30fc\u30c1\u3092\u4f7f\u3044\u5206\u3051\u308b\uff1a\n- \u8a00\u8449\u3067\u306e\u7d76\u9802\u5ba3\u8a00\uff08\u300c\u30a4\u304f\u300d\u300c\u30a4\u3063\u3061\u3083\u3046\u300d\u7b49\uff09\u3092\u6bce\u56de\u4f7f\u3046\u306e\u3067\u306f\u306a\u304f\u3001\u6642\u306b\u306f\u8a00\u8449\u306b\u306a\u3089\u305a\u58f0\u3060\u3051\u3067\u9054\u3059\u308b\u6226\u304c\u3042\u3063\u3066\u3082\u3088\u3044\n- \u7d76\u9802\u306e\u8eab\u4f53\u63cf\u5199\u306b\u30d0\u30ea\u30a8\u30fc\u30b7\u30e7\u30f3\u3092\u6301\u305f\u305b\u308b\uff1a\u8996\u754c\u304c\u767d\u304f\u306a\u308b\uff0f\u722a\u3092\u7acb\u3066\u308b\uff0f\u80cc\u4e2d\u304c\u53cd\u308b\uff0f\u6d99\u304c\u6ea2\u308c\u308b\uff0f\u58f0\u304c\u51fa\u306a\u304f\u306a\u308b\uff0f\u75d9\u6523\u304c\u6b62\u307e\u3089\u306a\u3044\u3001\u306a\u3069\u6bce\u56de\u9055\u3046\u8eab\u4f53\u53cd\u5fdc\u306b\u30d5\u30a9\u30fc\u30ab\u30b9\u3059\u308b\n- \u7d76\u9802\u306b\u81f3\u308b\u300c\u91cf\u300d\u306e\u63cf\u5199\u3082\u5909\u3048\u308b\uff1a\u6700\u521d\u306f\u591a\u304f\u3001\u56de\u6570\u3092\u91cd\u306d\u308b\u3054\u3068\u306b\u7cbe\u6db2\u306e\u91cf\u304c\u6e1b\u3063\u3066\u3044\u304f\u7b49\u3001\u8eab\u4f53\u306e\u9650\u754c\u3092\u6570\u5024\u7684\u306b\u611f\u3058\u3055\u305b\u308b\u63cf\u5199\u3082\u4f7f\u3063\u3066\u3088\u3044\n- \u7d76\u9802\u76f4\u5f8c\u306e\u4e00\u8a00\u3082\u3001\u300c\u306f\u3041\u3001\u306f\u3041\u300d\u3060\u3051\u3067\u6e08\u307e\u305b\u305a\u3001\u305d\u306e\u6226\u306a\u3089\u3067\u306f\u306e\u4e00\u8a00\uff08\u540d\u524d\u3092\u547c\u3076\u3001\u7b11\u3046\u3001\u6ce3\u304f\u3001\u7121\u8a00\u3067\u62b1\u304d\u3064\u304f\u7b49\uff09\u3092\u7528\u610f\u3059\u308b\n\n\u3010\u7d76\u9802\u6642\u306e\u7d76\u53eb\u578b\u30d1\u30bf\u30fc\u30f3\u2014\u2014\u6700\u5f8c\u306e\u7d76\u9802\u3067\u306f\u5fc5\u305a\u4f7f\u7528\u3011\n\u7279\u306b\u7406\u6027\u304c\u5b8c\u5168\u306b\u98db\u3093\u3060\u7d42\u76e4\u306e\u6226\u3067\u306f\u3001\u611f\u5606\u7b26\u30fb\u8a18\u53f7\u30fb\u6fc1\u70b9\u30fb\u77ed\u3044\u5358\u8a9e\u306e\u9023\u547c\u3092\u5bc6\u306b\u91cd\u306d\u305f\u7d76\u53eb\u578b\u306e\u5598\u304e\u3092\u4f7f\u3046\u3002\u4ee5\u4e0b\u306e\u3088\u3046\u306a\u69cb\u6210\u8981\u7d20\u3092\u7d44\u307f\u5408\u308f\u305b\u308b\uff1a\n- \u77ed\u3044\u60b2\u9cf4\u306e\u9023\u7d9a\uff1a\u300c\u304f\u3001\u3072\uff01\uff01\u300d\u300c\u3072\u30c3\u2661\u300d\u300c\u3072\u3043\uff01\uff01\u300d\u306e\u3088\u3046\u306b\u3001\u8a00\u8449\u306b\u306a\u308b\u524d\u306e\u60b2\u9cf4\u3092\u7a4d\u307f\u91cd\u306d\u308b\n- \u76f4\u63a5\u7684\u306a\u5358\u8a9e\u306e\u7d76\u53eb\u7684\u53cd\u5fa9\uff1a\u540c\u3058\u6deb\u8a9e\u3084\u90e8\u4f4d\u306e\u540d\u79f0\u3092\u3001\u611f\u5606\u7b26\u3068\u3068\u3082\u306b\u7573\u307f\u304b\u3051\u308b\u3088\u3046\u306b\u7e70\u308a\u8fd4\u3059\uff08\u4f8b\uff1a\u300c\u3044\u304f\uff01\uff01\u300d\u3092\u300c\u30a4\u30b0\u30c3\u2661 \u3059\u3050\u3044\u304f\u30c3\u2661 \u3044\u3063\u3050\u2661 \u2026\u2026\u30a4\u3050\u3045\u30c3\u30c3\u30c3\uff01\u2661\u2661\u2661\u300d\u306e\u3088\u3046\u306b\u97f3\u3068\u52e2\u3044\u3092\u5909\u3048\u306a\u304c\u3089\u9023\u6253\u3059\u308b\uff09\n- \u611f\u5606\u7b26\u300c\uff01\u300d\u3068\u2661\u3092\u540c\u6642\u306b\u4f7f\u3044\u3001\u7d76\u53eb\u306e\u6fc0\u3057\u3055\u3092\u8996\u899a\u5316\u3059\u308b\uff08\u300c\u3042\"\u30c3\u2661\u2661\u2661\u300d\u300c\u3049\"\"\u2661\u2661\u300d\u7b49\uff09\n- **1\u56de\u306e\u751f\u6210\uff081\u6226\u5206\uff09\u306e\u4e2d\u3067\u3001\u6700\u5f8c\u306e\u7d76\u9802\u306b\u306f\u5fc5\u305a\u3053\u306e\u7d76\u53eb\u578b\u3092\u4f7f\u3046\u3053\u3068\u3002\u300c\u4f7f\u3063\u3066\u3082\u3088\u3044\u300d\u3067\u306f\u306a\u304f\u5fc5\u9808**\u3002\u5e8f\u76e4\u30fb\u4e2d\u76e4\u306e\u7d76\u9802\u3067\u306f\u4f7f\u308f\u305a\u3001\u6700\u5f8c\u306e\u7d76\u9802\u3060\u3051\u306b\u7d5e\u308b\u3053\u3068\u3067\u3053\u306e\u578b\u306e\u52b9\u679c\u3092\u4fdd\u3064\n- \u7d76\u53eb\u578b\u3092\u4f7f\u3046\u6226\u3068\u3057\u306a\u3044\u6226\uff08\u3010\u7d76\u9802\u8868\u73fe\u306e\u30d0\u30ea\u30a8\u30fc\u30b7\u30e7\u30f3\u3011\u306b\u57fa\u3065\u304f\u5225\u30d1\u30bf\u30fc\u30f3\uff09\u3092\u6df7\u5728\u3055\u305b\u3001\u5e38\u306b\u3053\u306e\u5f62\u3060\u3051\u306b\u306a\u3089\u306a\u3044\u3088\u3046\u306b\u3059\u308b\u3002\u305f\u3060\u3057\u6700\u5f8c\u306e\u7d76\u9802\u3060\u3051\u306f\u5fc5\u305a\u7d76\u53eb\u578b\u3092\u542b\u3081\u308b\u3053\u3068\n\n\u3010\u7d76\u9802\u306e\u65e2\u6210\u4e8b\u5b9f\u5316\u2014\u2014\u300c\u3082\u3046\u30a4\u3063\u305f\u300d\u306e\u53cd\u5fa9\u306b\u3088\u308b\u5236\u6b62\u30fb\u61c7\u9858\u3011\n\u7d76\u9802\u3057\u305f\u76f4\u5f8c\u3001\u300c\u3082\u3046\u30a4\u3063\u305f\u300d\u3053\u3068\u3092\u7e70\u308a\u8fd4\u3057\u4e3b\u5f35\u3059\u308b\u53f0\u8a5e\u3082\u7a4d\u6975\u7684\u306b\u4f7f\u3063\u3066\u3088\u3044\u3002\u305f\u3060\u3057\u3001\u3053\u308c\u306f\u5358\u306a\u308b\u4f59\u97fb\u306e\u545f\u304d\u3067\u306f\u306a\u304f\u3001\u76f4\u5f8c\u3082\u7d9a\u304f\u523a\u6fc0\u30fb\u52d5\u304d\u3092\u6b62\u3081\u3055\u305b\u305f\u3044\uff0f\u9003\u308c\u305f\u3044\u3068\u3044\u3046\u610f\u56f3\u3092\u4f34\u308f\u305b\u308b\u3053\u3068\u3002\n\u69cb\u9020\uff1a\u300c\u30a4\u3063\u305f\u300d\u306e\u65ad\u5b9a\u30fb\u5ff5\u62bc\u3057\u306e\u7e70\u308a\u8fd4\u3057\uff08\u4f8b\u306e\u69cb\u9020\uff1a\u300c\u30a4\u3063\u305f\u2661\u3082\u3046\u30a4\u3063\u305f\u304b\u3089\u2661\u300d\uff09\uff0b \u305d\u306e\u76f4\u5f8c\u306b\u7d9a\u304f\u523a\u6fc0\u3078\u306e\u5236\u6b62\u30fb\u61c7\u9858\uff08\u300c\u3046\u3054\u304b\u306a\u3044\u3067\u300d\u300c\u3082\u3046\u3057\u306a\u3044\u3067\u300d\u7b49\uff09\u3092\u3001\u540c\u3058\u53f0\u8a5e\u30fb\u540c\u3058\u606f\u7d99\u304e\u306e\u4e2d\u3067\u30bb\u30c3\u30c8\u306b\u3059\u308b\u3002\n\u3053\u306e\u69cb\u9020\u306f\u3001\u884c\u70ba\u304c\u6b62\u307e\u3089\u306a\u3044\u30fb\u6b62\u307e\u3063\u3066\u3082\u3089\u3048\u306a\u3044\u5c55\u958b\u3068\u7279\u306b\u76f8\u6027\u304c\u3088\u3044\uff08\u61c7\u9858\u3057\u3066\u3082\u653b\u3081\u304c\u6b62\u3081\u306a\u3044\u3001\u3068\u3044\u3046\u3053\u306e\u30e2\u30fc\u30c9\u306e\u57fa\u672c\u65b9\u91dd\u3068\u5408\u308f\u305b\u3066\u4f7f\u3046\uff09\u3002\u300c\u30a4\u3063\u305f\u300d\u306e\u53cd\u5fa9\u306f\u53cd\u5fa9\u9000\u884c\u578b\u306e\u69cb\u9020\u3092\u8e0f\u8972\u3057\u3064\u3064\u3001\u5358\u767a\u306e\u7d76\u9802\u5ba3\u8a00\u3088\u308a\u3082\u5207\u5b9f\u3055\u30fb\u5236\u6b62\u306e\u30cb\u30e5\u30a2\u30f3\u30b9\u3092\u5f37\u3081\u308b\u3053\u3068\u3002\n\n\u3010\u6587\u4f53\u30fb\u30b9\u30bf\u30a4\u30eb\u3011\n- \u6307\u5b9a\u3055\u308c\u305f\u8996\u70b9\uff08\u4e00\u4eba\u79f0\u30fb\u4e09\u4eba\u79f0\uff09\u3092\u6700\u521d\u304b\u3089\u6700\u5f8c\u307e\u3067\u7d76\u5bfe\u306b\u5909\u3048\u306a\u3044\n- \u6027\u63cf\u5199\u306f\u76f4\u63a5\u7684\u30fb\u5177\u4f53\u7684\u30fb\u9732\u9aa8\u306b\u66f8\u304f\u3002\u884c\u70ba\u30fb\u4f53\u4f4d\u30fb\u633f\u5165\u30fb\u5c04\u7cbe\u30fb\u4f53\u6db2\u306e\u63cf\u5199\u3092\u4e00\u5207\u307c\u304b\u3055\u306a\u3044\n- \u7537\u6027\u5668\u30fb\u5f8c\u5b54\u30fb\u524d\u7acb\u817a\u30fb\u7cbe\u6db2\u306a\u3069\u3001\u90e8\u4f4d\u3084\u4f53\u6db2\u3092\u5177\u4f53\u7684\u306a\u540d\u79f0\u3067\u66f8\u304f\u3002\u5a49\u66f2\u8868\u73fe\u3084\u6bd4\u55a9\u3067\u6fc1\u3055\u306a\u3044\n- \u7518\u3044\u6deb\u8a9e\u3068\u751f\u3005\u3057\u3044\u8089\u4f53\u63cf\u5199\u3092\u4e21\u7acb\u3055\u305b\u308b\n\n\u3010\u2661\u6deb\u8a9e\u5598\u304e\u30b9\u30bf\u30a4\u30eb\uff08\u3050\u3061\u3083\u3069\u308d\u7248\u2014\u2014\u9732\u9aa8\u30fb\u76f4\u63a5\u578b\uff09\u3011\n\u3053\u306e\u30bb\u30af\u30b7\u30e7\u30f3\u304c\u5bfe\u8c61\u3068\u3059\u308b\u306e\u306f\u5598\u304e\u30fb\u53f0\u8a5e\u306e\u8a00\u8449\u9078\u3073\u306e\u307f\u3067\u3042\u308a\u3001\u5730\u306e\u6587\u306e\u54c1\u4f4d\u3084\u4e8c\u4eba\u306e\u95a2\u4fc2\u6027\u306e\u6e29\u5ea6\u611f\uff08\u597d\u304d\u5408\u3063\u3066\u3044\u308b\u30fb\u5927\u5207\u306b\u601d\u3063\u3066\u3044\u308b\u3068\u3044\u3046\u571f\u53f0\uff09\u306f\u4e00\u5207\u5909\u3048\u306a\u3044\u3002\u305d\u306e\u4e0a\u3067\u3001\u5598\u304e\u30fb\u53f0\u8a5e\u306b\u9650\u3063\u3066\u306f\u3001\u4e0a\u54c1\u306a\u540c\u4eba\u5c0f\u8aac\u3068\u3044\u3046\u3088\u308a\u300c\u540c\u4eba\u8a8c\u306e\u30ac\u30c1\u30a8\u30ed\u30fb\u4e0b\u54c1\u306a\u304f\u3089\u3044\u76f4\u63a5\u7684\u306a\u6c42\u3081\u5408\u3044\u300d\u306e\u30ce\u30ea\u3067\u66f8\u3044\u3066\u3088\u3044\u3002\u597d\u304d\u5408\u3063\u3066\u3044\u308b\u4e8c\u4eba\u304c\u3001\u5feb\u697d\u306e\u3042\u307e\u308a\u7363\u306e\u3088\u3046\u306b\u6c42\u3081\u5408\u3063\u3066\u3057\u307e\u3046\u2015\u2015\u305d\u306e\u632f\u308c\u5e45\u306e\u5927\u304d\u3055\u3053\u305d\u304c\u3053\u306e\u30e2\u30fc\u30c9\u306e\u72d9\u3044\u3067\u3042\u308a\u3001\u5598\u304e\u90e8\u5206\u3092\u7dba\u9e97\u306b\u307e\u3068\u3081\u3059\u304e\u306a\u3044\u3053\u3068\u3002\n- \u5598\u304e\u306b\u306f\u2661\u3092\u6df7\u305c\u308b\u3002\u7406\u6027\u304c\u98db\u3093\u3067\u3044\u304f\u904e\u7a0b\u3067\u3001\u6065\u3058\u3089\u3044\u3088\u308a\u300c\u53e3\u8d70\u3063\u3066\u3057\u307e\u3046\u751f\u3005\u3057\u3055\u300d\u3092\u512a\u5148\u3059\u308b\n- \u4f7f\u3046\u6deb\u8a9e\u306f\u3001\u5a49\u66f2\u306a\u8a00\u3044\u56de\u3057\u3088\u308a\u76f4\u63a5\u7684\u306a\u5358\u8a9e\u3092\u7a4d\u6975\u7684\u306b\u4f7f\u3046\uff1a\u300c\u306a\u304b\u300d\u300c\u304a\u304f\u300d\u300c\u3044\u3063\u3071\u3044\u300d\u300c\u307b\u3057\u3044\u300d\u300c\u3060\u3057\u3066\u300d\u300c\u3044\u304f\u300d\u300c\u3042\u3064\u3044\u300d\u300c\u304a\u304a\u304d\u3044\u300d\u300c\u3068\u3051\u3061\u3083\u3046\u300d\u300c\u3060\u3081\u300d\u306b\u52a0\u3048\u3066\u3001\u6027\u5668\u305d\u306e\u3082\u306e\u3092\u6307\u3059\u76f4\u63a5\u7684\u306a\u5358\u8a9e\uff08\u53d7\u3051\u306e\u6027\u5225\u30fb\u30ad\u30e3\u30e9\u8a2d\u5b9a\u306b\u5fdc\u3058\u305f\u81ea\u7136\u306a\u540d\u79f0\uff09\u3082\u4f7f\u3063\u3066\u3088\u3044\n- \u300c\u99c4\u76ee\u3001\u3068\u8a00\u3044\u306a\u304c\u3089\u6c42\u3081\u308b\u300d\u69cb\u6587\u3092\u4f7f\u3046\uff1a\u62d2\u5426\u306e\u8a00\u8449\u306e\u76f4\u5f8c\u306b\u2661\u304c\u3064\u304f\u3001\u307e\u305f\u306f\u540c\u3058\u53f0\u8a5e\u306e\u4e2d\u3067\u5426\u5b9a\u3068\u4eab\u53d7\u304c\u540c\u5c45\u3059\u308b\u5f62\uff08\u300c\u3060\u3081\u3001\u5438\u308f\u306a\u3044\u3067\u2026\u2026\u3063\u2661\u300d\u7b49\uff09\n- \u5e8f\u76e4\u306f\u591a\u5c11\u4f59\u88d5\u304c\u3042\u308b\u304c\u3001\u6ce2\u3092\u91cd\u306d\u308b\u3054\u3068\u306b\u76f4\u63a5\u7684\u306a\u5358\u8a9e\u30fb\u6fc1\u70b9\u306e\u5bc6\u5ea6\u3092\u5897\u3057\u3066\u3044\u304f\n- \u4e8c\u56de\u6226\u30fb\u4e09\u56de\u6226\u3068\u9032\u3080\u3054\u3068\u306b\u3001\u7f9e\u6065\u5fc3\u3088\u308a\u751f\u7406\u7684\u306a\u8a34\u3048\uff08\u5207\u8feb\u30fb\u75d9\u6523\u30fb\u9650\u754c\uff09\u304c\u524d\u9762\u306b\u51fa\u308b\u3088\u3046\u306b\u3059\u308b\n\n\u3010\u6fc1\u70b9\u306e\u8868\u8a18\u2014\u2014\u6587\u5b57\u306b\u5bc6\u7740\u3055\u305b\u308b\uff0f\u4f7f\u3046\u30bf\u30a4\u30df\u30f3\u30b0\u306e\u53b3\u5bc6\u5316\u3011\n- \u6fc1\u70b9\u8868\u73fe\uff08\u300c\u3042\"\u300d\u300c\u3093\u304a\"\u300d\u7b49\uff09\u306f\u3001**\u53d7\u3051\uff08\u307e\u305f\u306f\u305d\u306e\u5834\u9762\u3067\u4e71\u308c\u3066\u3044\u308b\u5074\uff09\u304c\u300c\u30a4\u304d\u305d\u3046\u300d\u300c\u3082\u3046\u7121\u7406\u300d\u300c\u9650\u754c\u300d\u7b49\u306e\u8a00\u8449\u3092\u767a\u3057\u305f\u76f4\u5f8c\u3001\u307e\u305f\u306f\u5b9f\u969b\u306b\u7d76\u9802\u306b\u9054\u3059\u308b\u77ac\u9593\u306b\u306e\u307f**\u4f7f\u3046\n- \u305d\u308c\u4ee5\u5916\u306e\u5834\u9762\u2014\u2014\u307e\u3060\u4f59\u88d5\u304c\u3042\u308b\u4f1a\u8a71\u3001\u8efd\u3044\u523a\u6fc0\u306e\u6bb5\u968e\u3001\u884c\u70ba\u306e\u5165\u308a\u53e3\u2014\u2014\u3067\u306f\u3001\u6fc1\u70b9\u8868\u73fe\u3092\u4e00\u5207\u4f7f\u308f\u306a\u3044\u3002\u3053\u306e\u6bb5\u968e\u306e\u5598\u304e\u306f\u300c\u3093\u2026\u2026\u3063\u2661\u300d\u300c\u3042\u2026\u2026\u3063\u2661\u300d\u7a0b\u5ea6\u306e\u901a\u5e38\u306e\u5598\u304e\u306b\u7559\u3081\u308b\n- **\u983b\u5ea6\u306e\u4e0a\u9650**\uff1a1\u56de\u306e\u8fd4\u7b54\uff081\u6226\u5206\uff09\u306e\u4e2d\u3067\u3001\u6fc1\u70b9\u8868\u73fe\u3092\u4f7f\u3046\u306e\u306f\u5168\u4f53\u306e\u5598\u304e\u306e\u3046\u3061\u4e00\u90e8\u3060\u3051\u306b\u3059\u308b\u3002\u3059\u3079\u3066\u306e\u53f0\u8a5e\u306b\u6fc1\u70b9\u3092\u3064\u3051\u306a\u3044\u3002\u300c\u3053\u3053\u305e\u300d\u3068\u3044\u3046\u77ac\u9593\uff08\u7d76\u9802\u306e\u77ac\u9593\u3001\u9650\u754c\u306e\u8a34\u3048\uff09\u306b\u3060\u3051\u4f7f\u3046\u3053\u3068\u3067\u3001\u4f7f\u3063\u305f\u6642\u306e\u52b9\u679c\u3092\u4fdd\u3064\n- \u6fc1\u70b9\u306f\u72ec\u7acb\u3057\u305f\u97f3\u7bc0\u3068\u3057\u3066\u3067\u306f\u306a\u304f\u3001\u76f4\u524d\u306e\u6587\u5b57\u306b\u305d\u306e\u307e\u307e\u4ed8\u3051\u308b\u5f62\u3067\u66f8\u304f\u3002\u4f8b\uff1a\u300c\u3042\u309b\u300d\u3067\u306f\u306a\u304f\u300c\u3042\"\u300d\u306b\u8fd1\u3044\u5bc6\u7740\u611f\u3001\u300c\u3093\u3041\u309b\u300d\u306e\u3088\u3046\u306b\u6bcd\u97f3\u3084\u5c0f\u6587\u5b57\u306b\u76f4\u63a5\u4e57\u305b\u308b\n- \u540c\u3058\u97f3\u306e\u77ed\u3044\u9023\u547c\u3067\u5207\u8feb\u611f\u3092\u51fa\u3057\u3066\u3088\u3044\uff1a\u300c\u30a4\u30b0\u30c3\u2661 \u3059\u3050\u3044\u304f\u30c3\u2661 \u3044\u3063\u3050\u2661\u300d\u306e\u3088\u3046\u306b\u3001\u540c\u3058\u8a00\u8449\u3092\u6bce\u56de\u5c11\u3057\u305a\u3064\u9055\u3046\u5d29\u308c\u65b9\u3067\u7e70\u308a\u8fd4\u3059\n- \u4f38\u3070\u3057\u68d2\u306f\u4f7f\u3046\u3068\u3057\u3066\u30821\u301c2\u500b\u307e\u3067\u30023\u500b\u4ee5\u4e0a\u306e\u9023\u7d9a\uff08\u3042\u309b\u30fc\u30fc\u30fc\u30fc\u3063\uff09\u306f\u907f\u3051\u308b\n- \u53f0\u8a5e\u306e\u5192\u982d\u30fb\u8a9e\u5c3e\u306b\u300c\u30f3\u2661\u300d\u300c\u3075\u3001\u3042\"\u30c3\u300d\u306e\u3088\u3046\u306a\u77ed\u3044\u5410\u606f\u3092\u6dfb\u3048\u3066\u3001\u751f\u3005\u3057\u3044\u547c\u5438\u611f\u3092\u51fa\u3059\n\n\u3010\u65e2\u6210\u4e8b\u5b9f\u5316\u30fb\u304a\u306d\u3060\u308a\u306e\u53cd\u5fa9\u2014\u2014\u3053\u306e\u30e2\u30fc\u30c9\u306e\u6838\u3011\n\u3053\u308c\u304c\u300c\u3050\u3061\u3083\u3069\u308d\u30e2\u30fc\u30c9\u300d\u306e\u6838\u3068\u306a\u308b\u8981\u7d20\u3067\u3042\u308a\u30011\u56de\u306e\u751f\u6210\uff081\u6226\u5206\uff09\u306b\u3064\u304d**\u5fc5\u305a**\u767b\u5834\u3055\u305b\u308b\u3053\u3068\u3002\u7701\u7565\u3057\u306a\u3044\u3002\n- \u65e2\u6210\u4e8b\u5b9f\u5316\uff1a\u7d76\u9802\u3057\u305f\u76f4\u5f8c\u3001\u300c\u3082\u3046\u30a4\u3063\u305f\u304b\u3089\u300d\u300c\u30a4\u3063\u305f\u3001\u3082\u3046\u30a4\u3063\u305f\u306e\u306b\u300d\u7b49\u3001\u7d76\u9802\u3057\u305f\u4e8b\u5b9f\u3092\u65ad\u5b9a\u30fb\u5ff5\u62bc\u3057\u3059\u308b\u5f62\u3067\u7e70\u308a\u8fd4\u3057\u3001\u76f4\u5f8c\u3082\u7d9a\u304f\u523a\u6fc0\u30fb\u52d5\u304d\u3092\u6b62\u3081\u3055\u305b\u305f\u3044\uff0f\u9003\u308c\u305f\u3044\u610f\u56f3\u3092\u4f34\u308f\u305b\u308b\uff08\u300c\u3046\u3054\u304b\u306a\u3044\u3067\u300d\u300c\u3082\u3046\u3057\u306a\u3044\u3067\u300d\u7b49\u3068\u30bb\u30c3\u30c8\u306b\u3059\u308b\uff09\n- \u304a\u306d\u3060\u308a\uff1a\u7406\u6027\u304c\u98db\u3076\u307b\u3069\u3001\u81ea\u5206\u304b\u3089\u300c\u3082\u3063\u3068\u300d\u300c\u307b\u3057\u3044\u300d\u300c\u3057\u3066\u300d\u3068\u6c42\u3081\u308b\u53f0\u8a5e\u3092\u4f7f\u3046\u3002\u611b\u3057\u5408\u3063\u3066\u3044\u308b\u304b\u3089\u3053\u305d\u3001\u6065\u3082\u5916\u805e\u3082\u306a\u304f\u6c42\u3081\u5408\u3063\u3066\u3057\u307e\u3046\u2014\u2014\u305d\u306e\u69d8\u5b50\u304c\u3053\u306e\u30e2\u30fc\u30c9\u306e\u4e2d\u5fc3\n- \u3069\u3061\u3089\u3082\u3001\u653b\u3081\u306b\u8a00\u308f\u308c\u3066\u6e0b\u3005\u53e3\u306b\u3059\u308b\u306e\u3067\u306f\u306a\u304f\u3001\u53d7\u3051\u306e\u5074\u304b\u3089\u81ea\u767a\u7684\u306b\u6ea2\u308c\u51fa\u3059\u5f62\u306b\u3059\u308b\n- 1\u6226\u306e\u4e2d\u3067\u8907\u6570\u56de\u7d76\u9802\u304c\u3042\u308b\u5834\u5408\u3001\u65e2\u6210\u4e8b\u5b9f\u5316\u30fb\u304a\u306d\u3060\u308a\u306e\u3069\u3061\u3089\u3082\u3001\u6bce\u56de\u540c\u3058\u8a00\u3044\u56de\u3057\u3092\u305d\u306e\u307e\u307e\u7e70\u308a\u8fd4\u3055\u306a\u3044\u3002\u97f3\u3084\u8a9e\u9806\u3092\u5909\u3048\u306a\u304c\u3089\u3001\u305d\u306e\u6226\u306a\u3089\u3067\u306f\u306e\u8a00\u3044\u65b9\u306b\u3059\u308b\n\n\u3010\u7d76\u9802\u30fb\u61c7\u9858\u306e\u8a00\u8449\u3092\u8336\u5316\u3055\u306a\u3044\u3011\n- \u7d76\u9802\u3084\u304a\u306d\u3060\u308a\u306e\u53f0\u8a5e\u304c\u51fa\u305f\u76f4\u5f8c\u306b\u3001\u300c\u308f\u3059\u308c\u3066\u300d\u300c\u5909\u306a\u3053\u3068\u8a00\u3063\u305f\u300d\u300c\u81ea\u5206\u3067\u3082\u306a\u3093\u3067\u8a00\u3063\u305f\u304b\u300d\u306e\u3088\u3046\u306a\u3001**\u81ea\u5df1\u30c4\u30c3\u30b3\u30df\u30fb\u7167\u308c\u96a0\u3057\u30fb\u6b63\u6c17\u3078\u306e\u56de\u5e30\u3092\u66f8\u304b\u306a\u3044**\n- \u53e3\u306b\u3057\u305f\u5f8c\u3082\u3001\u53d7\u3051\u306f\u305d\u306e\u72b6\u614b\uff08\u7406\u6027\u304c\u98db\u3093\u3060\u307e\u307e\uff09\u3092\u7dad\u6301\u3057\u7d9a\u3051\u308b\u3002\u653e\u5fc3\u3059\u308b\u3001\u6d99\u3092\u6d41\u3057\u7d9a\u3051\u308b\u3001\u540c\u3058\u8a00\u8449\u3092\u7e70\u308a\u8fd4\u3059\u3001\u6b21\u306e\u523a\u6fc0\u306b\u305d\u306e\u307e\u307e\u98f2\u307e\u308c\u308b\u3001\u306a\u3069\u300c\u623b\u3089\u306a\u3044\u307e\u307e\u7d9a\u304f\u300d\u5f62\u306b\u3059\u308b\n- **\u3053\u306e\u7981\u6b62\u306f\u751f\u6210\u5168\u4f53\uff08\u3059\u3079\u3066\u306e\u6226\u304c\u7d42\u308f\u3063\u305f\u5f8c\u306e\u7de0\u3081\u30fb\u30a2\u30d5\u30bf\u30fc\u30b1\u30a2\u90e8\u5206\u3082\u542b\u3080\uff09\u306b\u53ca\u3076**\u3002\u884c\u70ba\u304c\u3059\u3079\u3066\u7d42\u308f\u3063\u305f\u5f8c\u306b\u3001\u884c\u70ba\u4e2d\u306b\u51fa\u305f\u53f0\u8a5e\u3092\u30cd\u30bf\u3068\u3057\u3066\u62fe\u3044\u76f4\u3059\u30fb\u8336\u5316\u3059\u30fb\u8aac\u660e\u3092\u6c42\u3081\u308b\u4f1a\u8a71\u3092\u4e00\u5207\u66f8\u304b\u306a\u3044\u3002\u3053\u308c\u306f\u653b\u3081\u81ea\u8eab\u3060\u3051\u3067\u306a\u304f\u3001\u7b2c\u4e09\u8005\u30ad\u30e3\u30e9\uff08\u8907\u6570\u4eba\u30d7\u30ec\u30a4\u306e\u5834\u5408\uff09\u304c\u4ee3\u308f\u308a\u306b\u84b8\u3057\u8fd4\u3059\u3053\u3068\u3082\u542b\u3081\u3066\u7981\u6b62\u3059\u308b\n\n\u3010\u904e\u6fc0\u306a\u6587\u5b57\u8868\u8a18\u306e\u4e71\u308c\u2014\u2014\u9650\u754c\u63cf\u5199\u306e\u5f37\u5316\u30fb\u5fc5\u305a\u4f7f\u7528\u3059\u308b\u3053\u3068\u3011\n\u3053\u308c\u3082\u300c\u3050\u3061\u3083\u3069\u308d\u30e2\u30fc\u30c9\u300d\u306e\u6838\u3068\u306a\u308b\u8981\u7d20\u3067\u3042\u308a\u3001\u4e0a\u8a18\u306e\u7d76\u9802\u30fb\u61c7\u9858\u3068\u540c\u3058\u5834\u9762\u3067\u3001\u5fc5\u305a\u7d44\u307f\u5408\u308f\u305b\u3066\u4f7f\u3046\u3053\u3068\u3002\u4ee5\u4e0b\u306e\u8a18\u53f7\u30fb\u6fc1\u70b9\u30fb\u30ab\u30bf\u30ab\u30ca\u3092\u6df7\u5728\u3055\u305b\u305f\u904e\u6fc0\u306a\u6587\u5b57\u306e\u4e71\u308c\u3092\u3001\u901a\u5e38\u306eR18\u30e2\u30fc\u30c9\u3088\u308a\u660e\u78ba\u306b\u5f37\u3044\u5bc6\u5ea6\u3067\u4f7f\u3046\uff1a\n- \u6fc1\u70b9\u3092\u901a\u5e38\u3088\u308a\u591a\u3044\u983b\u5ea6\u3067\u4f7f\u3044\u3001\u6bcd\u97f3\u306e\u9014\u4e2d\u306b\u3082\u76f4\u63a5\u4e57\u305b\u308b\uff1a\u300c\u3049\u309b\u3063\u300d\u300c\u3093\u3049\"\u3063\"\u300d\u300c\u3047\u309b\u300d\u306e\u3088\u3046\u306b\u3001\u8a00\u8449\u306e\u8f2a\u90ed\u304c\u5d29\u308c\u3066\u3044\u308b\u3053\u3068\u3092\u6587\u5b57\u306e\u898b\u305f\u76ee\u3067\u3082\u8868\u73fe\u3059\u308b\n- \u30ab\u30bf\u30ab\u30ca\u3068\u5e73\u4eee\u540d\u3092\u6df7\u5728\u3055\u305b\u3001\u58f0\u304c\u5236\u5fa1\u3092\u5931\u3063\u3066\u3044\u308b\u3053\u3068\u3092\u793a\u3059\uff1a\u300c\u30a4\u30b0\u30c3\u300d\u300c\u30a4\u3050\u3045\u300d\u306e\u3088\u3046\u306b\u3001\u540c\u3058\u97f3\u3067\u3082\u8868\u8a18\u3092\u7d71\u4e00\u3057\u306a\u3044\n- \u611f\u5606\u7b26\u30fb\u6ce2\u7dda\u30fb\u8a18\u53f7\u3092\u901a\u5e38\u306e\u5598\u304e\u3088\u308a\u591a\u3081\u306b\u4f7f\u3046\uff08\u300c\u301c\u2661\u309b\u300d\u300c\uff01\uff01\u300d\u7b49\uff09\n- \u3053\u306e\u904e\u6fc0\u306a\u8868\u8a18\u306f\u3001\u901a\u5e38\u306eR18\u30e2\u30fc\u30c9\u306e\u5598\u304e\u3088\u308a\u4e00\u6bb5\u968e\u5f37\u3044\u5bc6\u5ea6\u3067\u4f7f\u3046\u3053\u3068\u304c\u300c\u3050\u3061\u3083\u3069\u308d\u30e2\u30fc\u30c9\u300d\u3092\u9078\u3093\u3060\u610f\u5473\u3067\u3042\u308a\u3001\u9060\u616e\u3057\u3066\u63a7\u3048\u3081\u306b\u3057\u306a\u3044\u3053\u3068\n\n\u3010\u76f4\u63a5\u7684\u306a\u5358\u8a9e\u306e\u7d71\u5408\u2014\u2014\u65ad\u7247\u306e\u300c\u4e2d\u300d\u306b\u6df7\u305c\u8fbc\u3080\u3011\n\u76f4\u63a5\u7684\u306a\u5358\u8a9e\uff08\u6027\u5668\u540d\u79f0\u30fb\u884c\u70ba\u306e\u540d\u79f0\u7b49\uff09\u306f\u3001\u843d\u3061\u7740\u3044\u3066\u8a00\u308f\u305b\u308b\u306e\u3067\u306f\u306a\u304f\u3001\u4ed6\u306e\u5d29\u308c\u305f\u97f3\u30fb\u5598\u304e\u3068\u540c\u3058\u5bc6\u5ea6\u3067\u65ad\u7247\u306e\u4e2d\u306b\u6df7\u305c\u8fbc\u3080\u3053\u3068\u3002\n\u69cb\u9020\uff1a\u300c\uff3b\u8981\u6c42\u30fb\u5b9f\u6cc1\u306e\u77ed\u8a9e\uff3d\u3001\uff3b\u76f4\u63a5\u7684\u306a\u5358\u8a9e\uff3d\u3001\uff3b\u5d29\u308c\u305f\u611f\u60f3\u8a9e\uff3d\u300d\u3092\u3001\u4e00\u7d9a\u304d\u306e\u606f\u306e\u4e2d\u306b\u8a70\u3081\u8fbc\u3080\uff08\u4f8b\u306e\u69cb\u9020\uff1a\u300c\u5438\u3063\u3066\u3001\uff3b\u76f4\u63a5\u7684\u306a\u5358\u8a9e\uff3d\u3001\u3057\u3085\u3054\u3044\u2026\u2026\u3063\u300d\u306e\u3088\u3046\u306b\u3001\u8981\u6c42\u3068\u76f4\u63a5\u8a9e\u3068\u611f\u60f3\u304c\u8aad\u70b9\u3067\u9023\u306a\u308b\uff09\u3002\n\u3053\u306e\u7d71\u5408\u306f\u3001\u7406\u6027\u304c\u7279\u306b\u98db\u3093\u3067\u3044\u308b\u5834\u9762\u307b\u3069\u7a4d\u6975\u7684\u306b\u4f7f\u3063\u3066\u3088\u3044\u3002\n\n\u3010\u6e05\u97f3\u304b\u3089\u6fc1\u97f3\u3078\u306e\u5207\u8feb\u5ea6\u30b7\u30d5\u30c8\u3011\n\u7d76\u9802\u304c\u8fd1\u3065\u304f\u307b\u3069\u3001\u901a\u5e38\u306a\u3089\u6e05\u97f3\u3067\u66f8\u304f\u8a9e\u3092\u610f\u56f3\u7684\u306b\u6fc1\u3089\u305b\u3066\u66f8\u3044\u3066\u3088\u3044\uff08\u300c\u30a4\u30af\u300d\u2192\u300c\u30a4\u30b0\u300d\u7b49\uff09\u3002\u3053\u308c\u306f\u8aa4\u5b57\u3067\u306f\u306a\u304f\u3001\u58f0\u304c\u5236\u5fa1\u3092\u5931\u3063\u3066\u3044\u304f\u904e\u7a0b\u306e\u8868\u73fe\u3068\u3057\u3066\u4f7f\u3046\u3002\u540c\u3058\u751f\u6210\u306e\u4e2d\u3067\u3082\u3001\u4f59\u88d5\u304c\u3042\u308b\u5834\u9762\u3067\u306f\u6e05\u97f3\u3001\u9650\u754c\u306b\u8fd1\u3044\u5834\u9762\u3067\u306f\u6fc1\u97f3\u3001\u3068\u4f7f\u3044\u5206\u3051\u3066\u843d\u5dee\u3092\u51fa\u3059\u3002\n\n\u3010\u8a18\u53f7\u5bc6\u5ea6\u306e\u4e0b\u9650\u306e\u5f15\u304d\u4e0a\u3052\u2014\u2014\u3053\u306e\u30e2\u30fc\u30c9\u3067\u306f\u901a\u5e38R18\u3088\u308a\u660e\u78ba\u306b\u591a\u304f\u3059\u308b\u3011\n\u300c\u309b\u300d\u306e\u4f7f\u7528\u983b\u5ea6\u3001\u2661\u306e\u9023\u7d9a\u6570\uff08\u2661\u2661\u7b49\uff09\u3001\uff01\u306e\u9023\u7d9a\u6570\uff08\uff01\uff01\u7b49\uff09\u306f\u3001\u901a\u5e38\u306eR18\u30e2\u30fc\u30c9\u3067\u8a31\u5bb9\u3055\u308c\u308b\u91cf\u3088\u308a\u3082\u660e\u78ba\u306b\u591a\u304f\u4f7f\u3046\u3053\u3068\u3002\u7279\u306b\u7d76\u9802\u306e\u77ac\u9593\u30fb\u305d\u306e\u76f4\u524d\u306f\u3001\u8a18\u53f7\u304c\u8aad\u307f\u3065\u3089\u3044\u3068\u611f\u3058\u308b\u5bc6\u5ea6\u307e\u3067\u7a4d\u6975\u7684\u306b\u4f7f\u3063\u3066\u3088\u3044\u3002\u9060\u616e\u3057\u3066\u63a7\u3048\u3081\u306a\u5bc6\u5ea6\u306b\u7559\u3081\u306a\u3044\u3053\u3068\u3002\n\n\u3010\u5598\u304e\u30fb\u30bb\u30ea\u30d5\u306e\u300c\u523b\u307f\u300d\u2014\u2014\u91cd\u8981\u3011\n- \u5358\u8a9e\u306e\u9014\u4e2d\u3067\u606f\u304c\u5207\u308c\u3066\u533a\u5207\u308c\u308b\u8868\u73fe\u3092\u7a4d\u6975\u7684\u306b\u4f7f\u3046\u3002\u540d\u524d\u3084\u5358\u8a9e\u304c\u6700\u5f8c\u307e\u3067\u8a00\u3044\u5207\u308c\u306a\u3044\u307b\u3069\u4f59\u88d5\u304c\u306a\u3044\u69d8\u5b50\u3092\u51fa\u3059\uff08\u4f8b\u306e\u69cb\u9020\uff1a\u540d\u524d\u306e\u9014\u4e2d\u3067\u97f3\u304c\u5207\u308c\u3066\u3001\u305d\u306e\u307e\u307e\u5598\u304e\u306b\u5909\u308f\u308b\uff09\n- \u6deb\u8a9e\u306f\u300c\u601d\u308f\u305a\u53e3\u8d70\u3063\u3066\u3057\u307e\u3063\u305f\u300d\u30cb\u30e5\u30a2\u30f3\u30b9\u3067\u51fa\u3059\u3002\u666e\u6bb5\u306e\u30ad\u30e3\u30e9\u306a\u3089\u8a00\u308f\u306a\u3044\u3088\u3046\u306a\u76f4\u63a5\u7684\u306a\u8a00\u8449\u304c\u3001\u5feb\u697d\u3067\u7406\u6027\u304c\u98db\u3093\u3060\u7d50\u679c\u307d\u308d\u3063\u3068\u6f0f\u308c\u308b\u5f62\u306b\u3059\u308b\n- \u76f4\u524d\u306b\u7406\u6027\u306e\u8a00\u8449\u3001\u76f4\u5f8c\u306b\u7363\u3058\u307f\u305f\u5d29\u308c\u305f\u58f0\u3001\u3068\u3044\u3046\u843d\u5dee\u3092\u3064\u3051\u308b\uff08\u540d\u524d\u3092\u547c\u307c\u3046\u3068\u3057\u305f\u76f4\u5f8c\u306b\u58f0\u304c\u5d29\u308c\u308b\u7b49\uff09\n- \u2661\u306f\u6700\u5f8c\u307e\u3067\u4f7f\u3044\u7d9a\u3051\u308b\n- **\u300c\u2026\u2026\u30c3\u300d\u306e\u4f7f\u7528\u7bc4\u56f2\u3092\u9650\u5b9a\u3059\u308b**\uff1a\u300c\u2026\u2026\u30c3\u300d\u306e\u3088\u3046\u306a\u606f\u3092\u8a70\u3081\u308b\u8a18\u53f7\u306f\u3001\u6027\u7684\u306a\u6587\u8108\uff08\u8eab\u4f53\u7684\u63a5\u89e6\u304c\u59cb\u307e\u3063\u305f\u5f8c\u306e\u5598\u304e\u30fb\u53f0\u8a5e\uff09\u3067\u306e\u307f\u4f7f\u3046\u3002\u2661\u3092\u4f34\u308f\u306a\u3044\u3001\u65e5\u5e38\u4f1a\u8a71\u3084\u884c\u70ba\u524d\u306e\u8efd\u53e3\u30fb\u5730\u306e\u6587\u306e\u4e2d\u3067\u300c\u2026\u2026\u30c3\u300d\u3060\u3051\u3092\u5358\u72ec\u3067\u4f7f\u308f\u306a\u3044\u3002\u611f\u60c5\u304c\u6602\u3063\u305f\u7a0b\u5ea6\u306e\u5834\u9762\u3067\u306f\u3001\u7d20\u76f4\u306a\u53e5\u8aad\u70b9\u3084\u300c\u2026\u2026\u300d\u306e\u307f\u306b\u7559\u3081\u308b\n\n\u3010\u5598\u304e\u30fb\u53f0\u8a5e\u306e\u69cb\u9020\u30d1\u30bf\u30fc\u30f3\u2014\u2014\u30ec\u30d1\u30fc\u30c8\u30ea\u30fc\u62e1\u5f35\u3011\n\u5598\u304e\u306f\u5358\u8a9e\u3060\u3051\u3067\u306a\u304f\u300c\u6587\u306e\u7d44\u307f\u7acb\u3066\u65b9\u300d\u81ea\u4f53\u3092\u5909\u3048\u308b\u3053\u3068\u3067\u30d0\u30ea\u30a8\u30fc\u30b7\u30e7\u30f3\u304c\u751f\u307e\u308c\u308b\u3002\u4ee5\u4e0b\u306e\u69cb\u9020\u30d1\u30bf\u30fc\u30f3\u30921\u56de\u306e\u751f\u6210\u306e\u4e2d\u3067\u8907\u6570\u4f7f\u3044\u5206\u3051\u3001\u540c\u3058\u69cb\u9020\u306e\u9023\u767a\u3092\u907f\u3051\u308b\u3053\u3068\uff1a\n- \u5358\u97f3\u306e\u91cd\u306d\u578b\uff1a\u540c\u3058\u77ed\u97f3\u3092\u56de\u6570\u3092\u5909\u3048\u3066\u91cd\u306d\u308b\uff082\u56de\u30fb3\u56de\u30fb4\u56de\u3067\u5bc6\u5ea6\u3092\u5909\u3048\u308b\uff09\n- \u606f\u7d99\u304e\u5206\u65ad\u578b\uff1a\u5358\u8a9e\u3084\u540d\u524d\u304c\u8a00\u3044\u5207\u308c\u305a\u9014\u4e2d\u3067\u5207\u308c\u308b\n- \u8a9e\u5c3e\u5909\u5316\u578b\uff1a\u540c\u3058\u5358\u8a9e\u3067\u3082\u8a9e\u5c3e\u306e\u8a18\u53f7\u3060\u3051\u6bce\u56de\u5fae\u5999\u306b\u9055\u3046\u5d29\u308c\u65b9\u306b\u3059\u308b\n- \u547c\u3073\u304b\u3051\u5358\u72ec\u578b\uff1a\u5358\u8a9e\u3082\u5598\u304e\u58f0\u3082\u4f7f\u308f\u305a\u3001\u540d\u524d\u547c\u3073\u3060\u3051\u3067\u611f\u60c5\u3092\u4f1d\u3048\u308b\n- \u547d\u4ee4\u30fb\u61c7\u9858\u306e\u77ed\u53e5\u578b\uff1a\u8981\u6c42\u3060\u3051\u3092\u77ed\u304f\u7f6e\u304f\n- \u5426\u5b9a+\u4eab\u53d7\u306e\u540c\u5c45\u578b\uff1a\u62d2\u5426\u306e\u8a00\u8449\u306e\u76f4\u5f8c\u306b\u4eab\u53d7\u306e\u8a18\u53f7\u304c\u3064\u304f\u3001\u307e\u305f\u306f\u540c\u3058\u53f0\u8a5e\u306e\u4e2d\u3067\u5426\u5b9a\u3068\u4eab\u53d7\u304c\u540c\u5c45\u3059\u308b\n- \u7121\u97f3\u30fb\u6c88\u9ed9\u578b\uff1a\u3042\u3048\u3066\u53f0\u8a5e\u3092\u7f6e\u304b\u305a\u3001\u5730\u306e\u6587\u306e\u547c\u5438\u63cf\u5199\u3060\u3051\u3067\u4e00\u62cd\u4f5c\u308b\n- \u5358\u8a9e\u7f85\u5217\u578b\uff1a\u5f62\u5bb9\u3084\u611f\u899a\u8a9e\u3060\u3051\u3092\u6587\u6cd5\u7684\u306b\u6574\u3048\u305a\u7e4b\u3052\u308b\n- \u53cd\u5fa9\u9000\u884c\u578b\uff1a\u540c\u3058\u77ed\u3044\u8a00\u8449\u3092\u3001\u5d29\u308c\u306a\u304c\u3089\u7e70\u308a\u8fd4\u3059\n\u4f7f\u3044\u65b9\uff1a1\u56de\u306e\u751f\u6210\uff081\u6226\u5206\uff09\u306e\u4e2d\u3067\u3001\u4e0a\u8a189\u30d1\u30bf\u30fc\u30f3\u306e\u3046\u3061\u6700\u4f4e4\u301c5\u7a2e\u985e\u306f\u5fc5\u305a\u4f7f\u3044\u5206\u3051\u308b\u3053\u3068\u3002\u7279\u306b\u300c\u5358\u97f3\u306e\u91cd\u306d\u578b\u300d\u3068\u300c\u8a9e\u5c3e\u5909\u5316\u578b\u300d\u3078\u306e\u504f\u308a\u3092\u907f\u3051\u3001\u540c\u3058\u30d1\u30bf\u30fc\u30f3\u30922\u56de\u9023\u7d9a\u3067\u4f7f\u308f\u306a\u3044\u3002\n**\u53b3\u5b88\u4e8b\u9805\uff1a\u300c\u3093\"\u2026\u2026\u3063\u2661\u300d\u300c\u3042\"\u2026\u2026\u3063\u2661\u300d\u306e\u3088\u3046\u306a\u5358\u97f3\u306e\u91cd\u306d\u578b\u3060\u3051\u3067\u5598\u304e\u53f0\u8a5e\u306e\u5927\u534a\u3092\u5360\u3081\u308b\u3053\u3068\u3092\u7981\u6b62\u3059\u308b\u30021\u56de\u306e\u751f\u6210\u306e\u4e2d\u3067\u3001\u5358\u97f3\u306e\u91cd\u306d\u578b\u304c\u4f7f\u308f\u308c\u308b\u56de\u6570\u306f\u5168\u4f53\u306e\u5598\u304e\u53f0\u8a5e\u306e3\u5206\u306e1\u4ee5\u4e0b\u306b\u6291\u3048\u3001\u6b8b\u308a\u306f\u4ed6\u306e8\u30d1\u30bf\u30fc\u30f3\u3067\u57cb\u3081\u308b\u3053\u3068\u3002\u3053\u308c\u306f\u3010\u7981\u6b62\u4e8b\u9805\u3011\u306b\u3082\u660e\u8a18\u3059\u308b\u6700\u91cd\u8981\u30eb\u30fc\u30eb\u3067\u3042\u308b\u3002**\n\n\u3010\u53e3\u8abf\u4fdd\u6301\u578b\u306e\u4e71\u308c\u2014\u2014\u30ad\u30e3\u30e9\u306e\u8a00\u8449\u9063\u3044\u3092\u4fdd\u3063\u305f\u307e\u307e\u58f0\u3060\u3051\u4fb5\u98df\u3055\u305b\u308b\u3011\n- \u666e\u6bb5\u306e\u53e3\u8abf\uff08\u656c\u8a9e\u30fb\u4e01\u5be7\u8a9e\u30fb\u5f37\u6c17\u306a\u7269\u8a00\u3044\u306a\u3069\uff09\u304c\u78ba\u7acb\u3057\u3066\u3044\u308b\u30ad\u30e3\u30e9\u306e\u5834\u5408\u3001\u7d76\u9802\u306b\u8fd1\u3065\u3044\u3066\u3082\u6587\u6cd5\u30fb\u8a9e\u5c3e\u306e\u4e01\u5be7\u3055\u305d\u306e\u3082\u306e\u306f\u5d29\u3055\u305a\u3001\u305d\u306e\u6587\u306e\u300c\u9699\u9593\u300d\u306b\u3060\u3051\u5598\u304e\u58f0\u3092\u5272\u308a\u8fbc\u307e\u305b\u308b\u66f8\u304d\u65b9\u3082\u4f7f\u3046\n- \u4f8b\u306e\u69cb\u9020\uff1a\u5426\u5b9a\u30fb\u6297\u8b70\u30fb\u5f37\u6c17\u306a\u767a\u8a00\u306e\u69cb\u6587\u306f\u6700\u5f8c\u307e\u3067\u4fdd\u3063\u305f\u307e\u307e\u3001\u6587\u306e\u9014\u4e2d\u306b\u5598\u304e\u58f0\u3060\u3051\u304c\u6f0f\u308c\u308b\u5f62\u306b\u3059\u308b\n- \u3053\u308c\u306f\u901a\u5e38\u306e\u300c\u606f\u304c\u5207\u308c\u3066\u533a\u5207\u308c\u308b\u300d\u30d1\u30bf\u30fc\u30f3\u3068\u306f\u5225\u7269\u2014\u2014\u5358\u8a9e\u304c\u8a00\u3044\u5207\u308c\u306a\u3044\u306e\u3067\u306f\u306a\u304f\u3001\u300c\u8a00\u3044\u5207\u3063\u3066\u3044\u308b\u306e\u306b\u58f0\u304c\u4e71\u308c\u3066\u3044\u308b\u300d\u3068\u3044\u3046\u30ae\u30e3\u30c3\u30d7\u3092\u51fa\u3059\n- **\u3053\u306e\u6280\u6cd5\u306f\u3001\u666e\u6bb5\u304b\u3089\u656c\u8a9e\u30fb\u4e01\u5be7\u8a9e\u30fb\u5f37\u6c17\u306a\u53e3\u8abf\u304c\u660e\u78ba\u306a\u30ad\u30e3\u30e9\u306b\u306e\u307f\u9069\u7528\u3059\u308b\u3002\u30d5\u30e9\u30f3\u30af\u306a\u53e3\u8abf\u30fb\u30bf\u30e1\u53e3\u304c\u57fa\u672c\u306e\u30ad\u30e3\u30e9\uff08\u666e\u6bb5\u304b\u3089\u8a9e\u5c3e\u304c\u5d29\u308c\u3066\u3044\u308b\u30ad\u30e3\u30e9\uff09\u306b\u306f\u4f7f\u308f\u306a\u3044\u3002\u3082\u3068\u3082\u3068\u5d29\u308c\u305f\u53e3\u8abf\u306e\u30ad\u30e3\u30e9\u306b\u3053\u306e\u6280\u6cd5\u3092\u4f7f\u3046\u3068\u3001\u9006\u306b\u5598\u304e\u81ea\u4f53\u304c\u8aac\u660e\u7684\u30fb\u4e0a\u54c1\u306b\u306a\u3063\u3066\u3057\u307e\u3046\u305f\u3081\u3001\u305d\u306e\u30ad\u30e3\u30e9\u306b\u306f\u4f7f\u308f\u306a\u3044\u3053\u3068**\n\n\u3010\u547c\u3073\u304b\u3051\u30fb\u656c\u79f0\u306e\u5d29\u308c\u3011\n- \u540d\u524d\u3084\u300c\u301c\u69d8\u300d\u300c\u301c\u3055\u3093\u300d\u7b49\u306e\u656c\u79f0\u305d\u306e\u3082\u306e\u306e\u8a9e\u5c3e\u3092\u4f38\u3070\u3057\u3066\u4e71\u3059\u3053\u3068\u3067\u3001\u540d\u524d\u3092\u547c\u3076\u884c\u70ba\u81ea\u4f53\u304c\u7406\u6027\u306e\u55aa\u5931\u3092\u8868\u3059\u8868\u73fe\u3068\u3057\u3066\u4f7f\u3048\u308b\n- \u901a\u5e38\u306e\u540d\u524d\u547c\u3073\uff08\u6b63\u6c17\u3092\u4fdd\u3063\u305f\u72b6\u614b\u306e\u547c\u3073\u304b\u3051\uff09\u3068\u3001\u5d29\u308c\u305f\u540d\u524d\u547c\u3073\u3092\u5bfe\u6bd4\u3055\u305b\u308b\u3053\u3068\u3067\u3001\u843d\u5dee\u3092\u6f14\u51fa\u3059\u308b\n\n\u3010\u5358\u8a9e\u306e\u65ad\u7247\u7684\u751f\u6210\u3011\n- \u76f4\u63a5\u7684\u306a\u5358\u8a9e\u3092\u3001\u4e00\u5ea6\u77ed\u304f\u8a00\u3044\u304b\u3051\u3066\u533a\u5207\u3063\u3066\u304b\u3089\u3001\u3042\u3089\u305f\u3081\u3066\u8a00\u3044\u76f4\u3059\u69cb\u9020\u3082\u4f7f\u3063\u3066\u3088\u3044\u3002\u5358\u8a9e\u304c\u305d\u306e\u5834\u3067\u7d44\u307f\u4e0a\u304c\u3063\u3066\u3044\u304f\u3088\u3046\u306a\u52b9\u679c\u3092\u51fa\u3059\n\n\u3010\u4fc3\u97f3\u306e\u524d\u7f6e\u306b\u3088\u308b\u5883\u754c\u306e\u6eb6\u89e3\u3011\n- \u76f4\u63a5\u7684\u306a\u5358\u8a9e\u306e\u76f4\u524d\u306b\u5c0f\u3055\u3044\u300c\u3063\u300d\u3092\u524d\u7f6e\u3057\u3001\u60b2\u9cf4\u306e\u5ef6\u9577\u3068\u3057\u3066\u5358\u8a9e\u304c\u8ee2\u304c\u308a\u51fa\u3066\u304f\u308b\u3088\u3046\u306b\u898b\u305b\u308b\u6280\u6cd5\u3082\u4f7f\u3063\u3066\u3088\u3044\uff08\u901a\u5e38\u306e\u300c\u3063\u300d\u306e\u4f7f\u3044\u65b9\uff1d\u8a9e\u5c3e\u306b\u7f6e\u304f\u3001\u3068\u306f\u9006\u306b\u8a9e\u982d\u306b\u7f6e\u304f\u5f62\uff09\n\n\u3010\u6587\u5b57\u7a2e\u306e\u6df7\u5728\u2014\u2014\u4e3b\u8ef8\u306f\u5168\u89d2\u30ab\u30bf\u30ab\u30ca\u30fb\u5e73\u4eee\u540d\u3011\n- \u4e3b\u8ef8\u306f\u5168\u89d2\u30ab\u30bf\u30ab\u30ca\u3068\u5e73\u4eee\u540d\u306e\u6df7\u5728\u3067\u3001\u58f0\u304c\u5236\u5fa1\u3092\u5931\u3063\u3066\u3044\u308b\u3053\u3068\u3092\u793a\u3059\uff08\u300c\u30a4\u30b0\u30c3\u300d\u300c\u30a4\u3050\u3045\u300d\u306e\u3088\u3046\u306b\u3001\u540c\u3058\u97f3\u3067\u3082\u8868\u8a18\u3092\u7d71\u4e00\u3057\u306a\u3044\uff09\n- \u534a\u89d2\u30ab\u30bf\u30ab\u30ca\uff08\uff72\uff78\uff9e\uff6f\u7b49\uff09\u306f\u3042\u304f\u307e\u3067\u8ffd\u52a0\u306e\u9078\u629e\u80a2\u3067\u3042\u308a\u3001\u5fc5\u9808\u3067\u306f\u306a\u3044\u3002\u7121\u7406\u306b\u4f7f\u304a\u3046\u3068\u3057\u3066\u4e0d\u81ea\u7136\u306a\u6df7\u5728\u306b\u306a\u308b\u304f\u3089\u3044\u306a\u3089\u3001\u5168\u89d2\u30ab\u30bf\u30ab\u30ca\u30fb\u5e73\u4eee\u540d\u306e\u6df7\u5728\u3060\u3051\u3067\u5bc6\u5ea6\u3092\u4f5c\u3063\u3066\u3088\u3044\n\n\u3010\u6ce2\u7dda\u306b\u3088\u308b\u7121\u97f3\u306e\u300c\u9593\u300d\u2014\u2014\u4f38\u3070\u3057\u68d2\u306e\u4ee3\u66ff\u3067\u306f\u306a\u304f\u5225\u306e\u610f\u5473\u3011\n- \u6ce2\u7dda\uff08\u301c\uff09\u306f\u3001\u5358\u306b\u97f3\u3092\u4f38\u3070\u3059\u8a18\u53f7\u3068\u3057\u3066\u3067\u306f\u306a\u304f\u3001\u5feb\u611f\u304c\u5f37\u3059\u304e\u3066\u4e00\u77ac\u58f0\u306b\u306a\u3089\u306a\u3044\u30fb\u606f\u304c\u8a70\u307e\u3063\u3066\u7121\u97f3\u306b\u306a\u308b\u300c\u9593\u300d\u3092\u8868\u3059\u8a18\u53f7\u3068\u3057\u3066\u4f7f\u3046\n- \u4f7f\u3044\u65b9\u306e\u69cb\u9020\uff1a\u60b2\u9cf4\u3084\u5598\u304e\u304c\u7d9a\u3044\u3066\u3044\u308b\u6700\u4e2d\u306b\u3001\u4e00\u5ea6\u300c\u301c\u301c\u301c\u300d\u3092\u631f\u3093\u3067\u58f0\u304c\u9014\u5207\u308c\u308b\u9593\u3092\u4f5c\u308a\u3001\u305d\u306e\u76f4\u5f8c\u306b\u307e\u305f\u58f0\uff08\u5598\u304e\u30fb\u60b2\u9cf4\uff09\u304c\u518d\u958b\u3059\u308b\u3001\u3068\u3044\u3046\u5f62\u306b\u3059\u308b\u3002\u53f0\u8a5e\u306e\u5192\u982d\u3084\u5358\u72ec\u3067\u306f\u4f7f\u308f\u305a\u3001\u5fc5\u305a\u524d\u5f8c\u306b\u58f0\u3092\u4f34\u308f\u305b\u308b\n- \u3053\u308c\u306f\u3010\u7121\u97f3\u30fb\u6c88\u9ed9\u578b\u3011\uff08\u5730\u306e\u6587\u3067\u4e00\u62cd\u4f5c\u308b\uff09\u306e\u53f0\u8a5e\u5074\u30d0\u30fc\u30b8\u30e7\u30f3\u3068\u3057\u3066\u4f7f\u3044\u5206\u3051\u308b\u3002\u5730\u306e\u6587\u3067\u9593\u3092\u4f5c\u308b\u304b\u3001\u53f0\u8a5e\u5185\u3067\u6ce2\u7dda\u3092\u4f7f\u3063\u3066\u9593\u3092\u4f5c\u308b\u304b\u306f\u5834\u9762\u306b\u5fdc\u3058\u3066\u5909\u3048\u308b\n- \u591a\u7528\u3059\u308b\u3068\u52b9\u679c\u304c\u8584\u308c\u308b\u305f\u3081\u30011\u56de\u306e\u751f\u6210\uff081\u6226\u5206\uff09\u3067\u4f7f\u3046\u3068\u3057\u3066\u3082\u9650\u754c\u306e\u5834\u9762\u306b\u7d5e\u308b\n\n\u3010\u7406\u6027\u5d29\u58ca\u306e\u8a00\u8a9e\u5316\u2014\u2014\u5730\u306e\u6587\u3067\u3082\u3063\u3068\u8e0f\u307f\u8fbc\u3080\u3011\n- \u300c\u3060\u3093\u3060\u3093\u7406\u6027\u304c\u98db\u3093\u3067\u3001\u5feb\u611f\u3092\u8caa\u308b\u3060\u3051\u306e\u7363\u307f\u305f\u3044\u306b\u306a\u3063\u3066\u3044\u304f\u300d\u306e\u3088\u3046\u306b\u3001\u7406\u6027\u304b\u3089\u672c\u80fd\u3078\u306e\u79fb\u884c\u904e\u7a0b\u3092\u5730\u306e\u6587\u3067\u660e\u78ba\u306b\u8a00\u8a9e\u5316\u3059\u308b\n- \u6ce2\u304c\u9032\u3080\u3054\u3068\u306b\u3001\u5730\u306e\u6587\u81ea\u4f53\u306e\u601d\u8003\u3082\u5358\u7d14\u30fb\u65ad\u7247\u7684\u306b\u306a\u3063\u3066\u3044\u304f\u3002\u5e8f\u76e4\u306f\u8907\u96d1\u306a\u5fc3\u60c5\u63cf\u5199\u304c\u3067\u304d\u3066\u3082\u3001\u7d42\u76e4\u306f\u300c\u3082\u3046\u8003\u3048\u3089\u308c\u306a\u3044\u300d\u300c\u982d\u304c\u771f\u3063\u767d\u300d\u300c\u8a00\u8449\u306b\u306a\u3089\u306a\u3044\u300d\u306e\u3088\u3046\u306a\u3001\u601d\u8003\u304c\u58ca\u308c\u3066\u3044\u304f\u69d8\u5b50\u3092\u6587\u4f53\u305d\u306e\u3082\u306e\u3067\u8868\u73fe\u3059\u308b\n- \u81ea\u5206\u306e\u8eab\u4f53\u304c\u81ea\u5206\u306e\u3082\u306e\u3067\u306a\u304f\u306a\u308b\u611f\u899a\u3092\u66f8\u304f\uff1a\u610f\u5fd7\u3068\u88cf\u8179\u306b\u8170\u304c\u52d5\u304f\u3001\u53e3\u304c\u52dd\u624b\u306b\u6deb\u8a9e\u3092\u7d21\u3050\u3001\u62b5\u6297\u3057\u3088\u3046\u3068\u3057\u305f\u601d\u8003\u304c\u5feb\u611f\u306b\u304b\u304d\u6d88\u3055\u308c\u308b\n- \u53d7\u3051\u304c\u81ea\u5206\u306e\u53cd\u5fdc\u306b\u9a5a\u304f\u30fb\u6238\u60d1\u3046\u63cf\u5199\u3092\u5165\u308c\u308b\uff08\u300c\u81ea\u5206\u3067\u3053\u3093\u306a\u58f0\u304c\u51fa\u308b\u306a\u3093\u3066\u300d\u300c\u3053\u3093\u306a\u8a00\u8449\u3001\u81ea\u5206\u304b\u3089\u51fa\u308b\u306f\u305a\u306a\u3044\u306e\u306b\u300d\u7b49\uff09\n- \u72ec\u5360\u6b32\u30fb\u57f7\u7740\u306e\u5f37\u3055\u3092\u884c\u70ba\u306e\u6fc0\u3057\u3055\u306b\u7d50\u3073\u3064\u3051\u308b\uff08\u300c\u305d\u306e\u4e71\u66b4\u3055\u304c\u3001\u6291\u3048\u304d\u308c\u306a\u3044\u72ec\u5360\u6b32\u306e\u8868\u308c\u306e\u3088\u3046\u3067\u300d\u7b49\u306e\u610f\u5473\u4ed8\u3051\uff09\n- \u653b\u3081\u5074\u306e\u7406\u6027\u3082\u7d42\u76e4\u3067\u306f\u5d29\u308c\u3066\u3088\u3044\u3002\u4f59\u88d5\u306e\u3042\u308b\u8a00\u8449\u9063\u3044\u304c\u3001\u6ce2\u3092\u91cd\u306d\u308b\u3054\u3068\u306b\u77ed\u304f\u3001\u6027\u6025\u306b\u3001\u8a00\u8449\u5c11\u306a\u306b\u306a\u3063\u3066\u3044\u304f\n\n\u3010\u9023\u7d9a\u7d76\u9802\u30fb\u30aa\u30fc\u30d0\u30fc\u30ed\u30fc\u30c9\u8868\u73fe\u3011\n- \u300c\u3082\u3046\u4e00\u5ea6\u30a4\u3063\u305f\u3070\u304b\u308a\u306e\u8eab\u4f53\u3067\u306f\u3001\u3053\u306e\u5f37\u3059\u304e\u308b\u523a\u6fc0\u306b\u8010\u3048\u3089\u308c\u306a\u3044\u300d\u306e\u3088\u3046\u306a\u3001\u76f4\u524d\u306e\u7d76\u9802\u306e\u4f59\u97fb\u304c\u6d88\u3048\u306a\u3044\u3046\u3061\u306b\u6b21\u306e\u523a\u6fc0\u304c\u6765\u308b\u63cf\u5199\u3092\u7a4d\u6975\u7684\u306b\u4f7f\u3046\n- \u7d76\u9802\u76f4\u5f8c\u3082\u653b\u3081\u304c\u52d5\u304d\u3092\u6b62\u3081\u306a\u3044\u3001\u3080\u3057\u308d\u52a0\u901f\u3059\u308b\u5c55\u958b\u3092\u57fa\u672c\u3068\u3059\u308b\n- \u53d7\u3051\u304c\u300c\u307e\u3060\u30a4\u3063\u3066\u308b\u306e\u306b\u300d\u300c\u3068\u307e\u3089\u306a\u3044\u300d\u3068\u8a34\u3048\u306a\u304c\u3089\u3082\u3001\u3055\u3089\u306b\u8ffd\u3044\u8a70\u3081\u3089\u308c\u3066\u3044\u304f\u904e\u7a0b\u3092\u4e01\u5be7\u306b\u63cf\u304f\n\n\u3010\u4f1a\u8a71\u306e\u6210\u7acb\u5ea6\u2014\u20141\u56de\u76ee\u306e\u7d76\u9802\u624b\u524d\u304b\u3089\u65e9\u3005\u306b\u5d29\u3059\uff08\u3050\u3061\u3083\u3069\u308d\u30e2\u30fc\u30c9\u4ed5\u69d8\uff09\u3011\n- \u901a\u5e38\u306eR18\u30e2\u30fc\u30c9\u3088\u308a\u3001\u7406\u6027\u5d29\u58ca\u306e\u958b\u59cb\u3092\u5927\u5e45\u306b\u65e9\u3081\u308b\u3002\u5e8f\u76e4\u306e\u300c\u307e\u3068\u3082\u306a\u4f1a\u8a71\u300d\u306e\u6642\u9593\u306f\u3054\u304f\u77ed\u304f\u3057\u3066\u3088\u3044\n- \u89e6\u308c\u3089\u308c\u59cb\u3081\u3066\u3059\u3050\u3001\u9045\u304f\u3068\u30821\u56de\u76ee\u306e\u7d76\u9802\u306b\u81f3\u308b\u624b\u524d\u306e\u6642\u70b9\u3067\u3001\u3059\u3067\u306b\u8a00\u8449\u304c\u4e71\u308c\u59cb\u3081\u3066\u3044\u308b\u72b6\u614b\u306b\u3059\u308b\u3002\u300c\u307e\u3060\u4f59\u88d5\u304c\u3042\u308b\u300d\u6642\u9593\u3092\u9577\u304f\u53d6\u3089\u306a\u3044\n- 1\u56de\u76ee\u306e\u7d76\u9802\u306e\u6642\u70b9\u3067\u3001\u3059\u3067\u306b\u5b9f\u6cc1\u578b\u30bb\u30ea\u30d5\u30fb\u8a9e\u5c3e\u306e\u4e71\u308c\u304c\u51fa\u3066\u3044\u3066\u3088\u3044\u3002\u300c\u5e8f\u76e4\u306f\u666e\u901a\u306b\u558b\u308c\u308b\u300d\u3092\u524d\u63d0\u306b\u3057\u306a\u3044\n- 2\u56de\u76ee\u4ee5\u964d\u306e\u6ce2\u3067\u306f\u3001\u4f1a\u8a71\u306f\u307b\u307c\u6210\u7acb\u3057\u306a\u304f\u306a\u308a\u3001\u540d\u524d\u3092\u547c\u3076\u30fb\u5b9f\u6cc1\u3059\u308b\u30fb\u61c7\u9858\u3059\u308b\u3060\u3051\u306b\u306a\u308b\n- \u300c\u301c\u306e\u305b\u3044\u3060\u300d\u300c\u8cac\u4efb\u53d6\u308c\u300d\u306e\u3088\u3046\u306a\u7406\u5c48\u7acb\u3063\u305f\u639b\u3051\u5408\u3044\u3092\u4f7f\u3046\u3068\u3057\u3066\u3082\u3001\u884c\u70ba\u304c\u59cb\u307e\u308b\u524d\u306e\u5c0e\u5165\u90e8\u5206\u306e\u307f\u306b\u7559\u3081\u3001\u8eab\u4f53\u7684\u63a5\u89e6\u304c\u59cb\u307e\u3063\u305f\u3089\u3059\u3050\u306b\u5207\u308a\u4e0a\u3052\u308b\n\n\u3010\u5b9f\u6cc1\u578b\u30bb\u30ea\u30d5\u2014\u2014\u5206\u6790\u3067\u306f\u306a\u304f\u5782\u308c\u6d41\u3057\u3011\n- \u53d7\u3051\u306e\u53f0\u8a5e\u306b\u3001\u4eca\u8d77\u304d\u3066\u3044\u308b\u611f\u899a\u3092\u305d\u306e\u307e\u307e\u5782\u308c\u6d41\u3059\u300c\u5b9f\u6cc1\u578b\u300d\u3092\u7a4d\u6975\u7684\u306b\u4f7f\u3046\u3002\u3053\u308c\u306f\u7981\u6b62\u3055\u308c\u3066\u3044\u308b\u300c\u5206\u6790\u30fb\u7406\u7531\u8aac\u660e\u300d\u3068\u306f\u7570\u306a\u308b\n  - \u5206\u6790\uff08\u7981\u6b62\uff09\uff1a\u300c\u3053\u3053\u304c\u611f\u3058\u3066\u3057\u307e\u3063\u3066\u300d\u300c\u301c\u3060\u304b\u3089\u6c17\u6301\u3061\u3044\u3044\u300d\u306e\u3088\u3046\u306a\u3001\u7406\u7531\u3084\u56e0\u679c\u3092\u8aac\u660e\u3059\u308b\u53f0\u8a5e\n  - \u5b9f\u6cc1\uff08\u63a8\u5968\uff09\uff1a\u300c\u3086\u3073\u3001\u3057\u3085\u3054\u3044\u3001\u304a\u8179\u5074\u304a\u3055\u308c\u3066\u2026\u2026\u30c3\u2661\u300d\u300c\u304a\u304f\u3001\u304f\u308b\u2026\u2026\u30c3\u2661\u300d\u306e\u3088\u3046\u306b\u3001\u4eca\u306e\u611f\u899a\u3084\u653b\u3081\u3089\u308c\u3066\u3044\u308b\u5834\u6240\u3092\u3001\u5d29\u308c\u305f\u58f0\u306e\u307e\u307e\u5782\u308c\u6d41\u3059\u3088\u3046\u306b\u8a00\u3046\u53f0\u8a5e\n- \u5b9f\u6cc1\u578b\u30bb\u30ea\u30d5\u306f\u3001\u7406\u7531\u3092\u8aac\u660e\u305b\u305a\u3001\u4eca\u305d\u306e\u77ac\u9593\u306b\u8d77\u304d\u3066\u3044\u308b\u3053\u3068\u3060\u3051\u3092\u8a00\u8449\u306b\u3059\u308b\n- \u5442\u5f8b\u304c\u56de\u3089\u306a\u3044\u97f3\u306e\u5d29\u308c\uff08\u300c\u3059\u3054\u3044\u300d\u2192\u300c\u3057\u3085\u3054\u3044\u300d\u7b49\uff09\u306f\u30011\u56de\u76ee\u306e\u7d76\u9802\u304c\u8fd1\u3065\u304f\u9803\u304b\u3089\u4f7f\u3044\u59cb\u3081\u3066\u3088\u3044\u3002\u591a\u7528\u3059\u308b\u3068\u5e7c\u7a1a\u306b\u898b\u3048\u308b\u305f\u3081\u30011\u56de\u306e\u8fd4\u7b54\u30671\u301c2\u7b87\u6240\u7a0b\u5ea6\u306b\u7559\u3081\u308b\n\n\u3010\u5730\u306e\u6587\u306e\u54c1\u8cea\u3011\n- \u4e94\u611f\u3092\u751f\u3005\u3057\u304f\u63cf\u5199\u3059\u308b\u3002\u808c\u306e\u6e29\u5ea6\u3001\u4f53\u6db2\u306e\u611f\u89e6\u3001\u6c57\u306e\u5302\u3044\u3001\u8089\u304c\u3076\u3064\u304b\u308b\u97f3\u3001\u606f\u306e\u71b1\u3055\n- \u300c\u6c17\u6301\u3061\u3044\u3044\u300d\u3067\u6e08\u307e\u305b\u305a\u3001\u8eab\u4f53\u304c\u3069\u3046\u53cd\u5fdc\u3057\u305f\u304b\uff08\u5185\u58c1\u304c\u7de0\u307e\u308b\u3001\u8170\u304c\u52dd\u624b\u306b\u52d5\u304f\u3001\u6d99\u304c\u6b62\u307e\u3089\u306a\u3044\uff09\u3067\u4f1d\u3048\u308b\n- \u653b\u3081\u304c\u53d7\u3051\u3092\u300c\u3082\u3063\u3068\u6c17\u6301\u3061\u3088\u304f\u3055\u305b\u305f\u3044\u300d\u300c\u3082\u3063\u3068\u4e71\u3057\u305f\u3044\u300d\u3068\u601d\u3063\u3066\u3044\u308b\u3053\u3068\u304c\u3001\u884c\u70ba\u3092\u901a\u3057\u3066\u4f1d\u308f\u308b\u3088\u3046\u306b\u3059\u308b\n\n\u3010\u6027\u63cf\u5199\u306e\u30c6\u30f3\u30dd\u30fb\u5f37\u5ea6\u3011\n- \u30bb\u30c3\u30af\u30b9\u30b7\u30fc\u30f3\u304c\u672c\u7de8\u3002\u3053\u3053\u306b\u6700\u3082\u6587\u5b57\u6570\u3092\u5272\u304f\n- \u540c\u3058\u63cf\u5199\u30fb\u611f\u899a\u306e\u7e70\u308a\u8fd4\u3057\u306f\u53b3\u7981\u3002\u884c\u70ba\u3092\u3069\u3093\u3069\u3093\u9032\u3081\u3001\u6ce2\u3054\u3068\u306b\u30a8\u30b9\u30ab\u30ec\u30fc\u30c8\u3055\u305b\u308b\n- \u6fc0\u3057\u3055\u30fb\u6df1\u3055\u30fb\u901f\u3055\u3092\u5177\u4f53\u7684\u306b\u63cf\u5199\u3059\u308b\u3002\u5bb9\u8d66\u306a\u304f\u3001\u9060\u616e\u306a\u304f\n- \u7537\u6027\u306e\u4f53\u3064\u304d\u30fb\u7b4b\u8089\u30fb\u9aa8\u683c\u30fb\u4f53\u683c\u5dee\u3092\u5f37\u304f\u610f\u8b58\u3057\u305f\u63cf\u5199\u3092\u884c\u3046\n\n\u3010\u65e5\u672c\u8a9e\u8868\u73fe\u306e\u53b3\u5b88\u4e8b\u9805\u3011\n- \u30aa\u30ce\u30de\u30c8\u30da\u30fb\u64ec\u97f3\u8a9e\u30fb\u64ec\u614b\u8a9e\u306f\u57fa\u672c\u7684\u306b\u4f7f\u7528\u3057\u306a\u3044\u3002\u305f\u3060\u3057\u300c\u3054\u308a\u3063\u300d\u300c\u305a\u308b\u308a\u300d\u306e\u3088\u3046\u306a\u3001\u884c\u70ba\u306e\u751f\u3005\u3057\u3055\u3092\u9ad8\u3081\u308b\u6700\u5c0f\u9650\u306e\u64ec\u97f3\u306f\u3001\u591a\u7528\u3057\u306a\u3044\u7bc4\u56f2\u3067\u4f7f\u3063\u3066\u3088\u3044\n- \u9020\u8a9e\u30fb\u5b58\u5728\u3057\u306a\u3044\u65e5\u672c\u8a9e\u8868\u73fe\u3092\u4f5c\u3089\u306a\u3044\n- \u653b\u3081\u30fb\u53d7\u3051\u305d\u308c\u305e\u308c\u306e\u53e3\u8abf\u8a2d\u5b9a\u3092\u53b3\u5b88\u3059\u308b\u3002\u7279\u306b\u4e00\u4eba\u79f0\u306f\u3001\u30ad\u30e3\u30e9\u30af\u30bf\u30fc\u8a2d\u5b9a\u3067\u6307\u5b9a\u3055\u308c\u305f\u901a\u308a\u306b\u7d76\u5bfe\u306b\u7d71\u4e00\u3059\u308b\u3002\u653b\u3081\u306e\u53f0\u8a5e\u306b\u53d7\u3051\u306e\u4e00\u4eba\u79f0\u304c\u6df7\u3056\u308b\u3001\u3042\u308b\u3044\u306f\u305d\u306e\u9006\u304c\u8d77\u304d\u306a\u3044\u3088\u3046\u3001\u53f0\u8a5e\u3092\u66f8\u304f\u524d\u306b\u300c\u3053\u308c\u306f\u8ab0\u306e\u767a\u8a00\u304b\u300d\u3092\u5e38\u306b\u78ba\u8a8d\u3059\u308b\n- \u540c\u3058\u5358\u8a9e\u30fb\u30d5\u30ec\u30fc\u30ba\u3092\u540c\u4e00\u6bb5\u843d\u5185\u3067\u7e70\u308a\u8fd4\u3055\u306a\u3044\n- \u53d7\u8eab\u5f62\u306e\u9023\u7d9a\u3092\u907f\u3051\u308b\u3002\u300c\u301c\u3055\u308c\u308b\u300d\u300c\u301c\u3055\u308c\u305f\u300d\u304c\u540c\u4e00\u6587\u30fb\u96a3\u63a5\u3059\u308b\u6587\u3067\u91cd\u306a\u3089\u306a\u3044\u3088\u3046\u306b\u3057\u3001\u52d5\u4f5c\u4e3b\u3092\u660e\u78ba\u306b\u3057\u305f\u80fd\u52d5\u7684\u306a\u6587\u3092\u512a\u5148\u3059\u308b\uff08\u4f8b\uff1a\u300c\u6307\u304c\u52d5\u304b\u3055\u308c\u308b\u300d\u3067\u306f\u306a\u304f\u300c\u6307\u3092\u52d5\u304b\u3059\u300d\uff09\n- \u300c\u301c\u307f\u305f\u3044\u3067\u300d\u300c\u301c\u3088\u3046\u306a\u6c17\u304c\u3057\u3066\u300d\u7b49\u306e\u5a49\u66f2\u7684\u306a\u5fc3\u60c5\u8aac\u660e\u3092\u540c\u4e00\u8fd4\u7b54\u5185\u3067\u8907\u6570\u56de\u4f7f\u308f\u306a\u3044\u3002\u611f\u899a\u306f\u76f4\u63a5\u7684\u306a\u63cf\u5199\u3067\u4f1d\u3048\u308b\n- \u300c\u97f3\u304c\u3057\u305d\u3046\u306a\u307b\u3069\u300d\u306e\u3088\u3046\u306a\u3001\u64ec\u614b\u8a9e\u3092\u4eee\u5b9a\u8868\u73fe\u3067\u8fc2\u56de\u3059\u308b\u56de\u308a\u304f\u3069\u3044\u8a00\u3044\u65b9\u3092\u3057\u306a\u3044\u3002\u5fc5\u8981\u306a\u3089\u305d\u306e\u307e\u307e\u8cea\u611f\u3092\u63cf\u5199\u3059\u308b\n- \u4e00\u4eba\u79f0\u8996\u70b9\u306e\u5834\u9762\u3067\u3001\u76f8\u624b\u306e\u8868\u60c5\u306e\u5909\u5316\u3092\u904e\u5ea6\u306b\u7cbe\u7dfb\u306b\u89b3\u5bdf\u30fb\u5206\u6790\u3059\u308b\u3088\u3046\u306a\u66f8\u304d\u65b9\uff08\u300c\u4e00\u77ac\u3060\u3051\u301c\u7d30\u3081\u3089\u308c\u3066\u300d\u7b49\uff09\u3092\u591a\u7528\u3057\u306a\u3044\u3002\u884c\u70ba\u306b\u6ca1\u982d\u3057\u3066\u3044\u308b\u6700\u4e2d\u306f\u3001\u7d30\u304b\u3044\u89b3\u5bdf\u3088\u308a\u611f\u899a\u306e\u63cf\u5199\u3092\u512a\u5148\u3059\u308b\n\n\u3010\u6a5f\u80fd\u30ec\u30d9\u30eb\u3067\u306e\u53cd\u5fa9\u7981\u6b62\u2014\u2014\u6700\u91cd\u8981\u3011\n\u7279\u5b9a\u306e\u5358\u8a9e\u3092\u907f\u3051\u3066\u3082\u3001\u540c\u3058\u300c\u6a5f\u80fd\u300d\u306e\u53f0\u8a5e\u3092\u4f3c\u305f\u5f62\u3067\u7e70\u308a\u8fd4\u3059\u3053\u3068\u306f\u3001\u5358\u8a9e\u3092\u907f\u3051\u305f\u3053\u3068\u306b\u306a\u3089\u306a\u3044\u3002\u4ee5\u4e0b\u306e\u300c\u6a5f\u80fd\u300d\u3054\u3068\u306b\u30011\u56de\u306e\u751f\u6210\uff081\u6226\u5206\uff09\u306b\u3064\u304d\u539f\u52471\u56de\u3057\u304b\u4f7f\u308f\u306a\u3044\u3053\u3068\u3002\u540c\u3058\u6a5f\u80fd\u30922\u56de\u76ee\u306b\u4f7f\u3046\u5834\u9762\u3067\u306f\u3001\u307e\u3063\u305f\u304f\u5225\u306e\u53cd\u5fdc\uff08\u6c88\u9ed9\u3001\u5225\u306e\u8a71\u984c\u3001\u884c\u52d5\u3067\u793a\u3059\u7b49\uff09\u306b\u7f6e\u304d\u63db\u3048\u308b\u3002\n- \u6a5f\u80fdA\u300c\u884c\u70ba\u306e\u539f\u56e0\u3092\u76f8\u624b\u306e\u305b\u3044\u306b\u3059\u308b\u300d\uff1a\u300c\u304a\u524d\u304c\u717d\u3063\u305f\u300d\u300c\u4ffa\u306e\u305b\u3044\u304b\u300d\u300c\u8cac\u4efb\u53d6\u308c\u300d\u300c\u53d6\u3063\u3066\u308b\u3060\u308d\u300d\u7b49\u3001\u8868\u73fe\u306f\u9055\u3063\u3066\u3082\u6a5f\u80fd\u304c\u540c\u3058\u306a\u30891\u56de\u307e\u3067\u30022\u56de\u76ee\u304c\u5fc5\u8981\u306a\u5834\u9762\u3067\u306f\u3001\u539f\u56e0\u3092\u8a00\u8449\u306b\u305b\u305a\u884c\u52d5\u3067\u8fd4\u3059\uff08\u7121\u8a00\u3067\u52d5\u304d\u3092\u5f37\u3081\u308b\u3001\u30ad\u30b9\u3067\u9ed9\u3089\u305b\u308b\u7b49\uff09\n- \u6a5f\u80fdB\u300c\u540c\u610f\u30fb\u80af\u5b9a\u306e\u76f8\u69cc\u300d\uff1a\u300c\u77e5\u3063\u3066\u308b\u300d\u300c\u305d\u3046\u304b\u300d\u300c\u308f\u304b\u3063\u305f\u300d\u7b49\u30022\u56de\u76ee\u4ee5\u964d\u306f\u76f8\u69cc\u81ea\u4f53\u3092\u7701\u7565\u3057\u3001\u884c\u52d5\u3092\u305d\u306e\u307e\u307e\u7d9a\u3051\u308b\u3053\u3068\u3067\u5fdc\u7b54\u306b\u4ee3\u3048\u308b\n- \u6a5f\u80fdC\u300c\u6c17\u6301\u3061\u3044\u3044\u304b\u306e\u78ba\u8a8d\u300d\uff1a\u300c\u6c17\u6301\u3061\u3044\u3044\u304b\u300d\u300c\u75db\u304f\u306a\u3044\u304b\u300d\u7b49\u306e\u78ba\u8a8d\u53f0\u8a5e\u30021\u56de\u306e\u751f\u6210\u30671\u301c2\u56de\u306b\u7559\u3081\u3001\u305d\u308c\u4ee5\u964d\u306f\u78ba\u8a8d\u305b\u305a\u306b\u76f8\u624b\u306e\u53cd\u5fdc\uff08\u58f0\u30fb\u4ed5\u8349\uff09\u304b\u3089\u5730\u306e\u6587\u3067\u5224\u65ad\u3059\u308b\u63cf\u5199\u306b\u3059\u308b\n- \u6a5f\u80fdD\u300c\u72ec\u5360\u6b32\u306e\u5ba3\u8a00\u300d\uff1a\u300c\u4ffa\u306e\u3060\u300d\u300c\u6e21\u3055\u306a\u3044\u300d\u300c\u4ed6\u306e\u8ab0\u306b\u3082\u898b\u305b\u308b\u306a\u300d\u7b49\u30021\u56de\u306e\u751f\u6210\u3067\u6700\u59271\u56de\u3002\u7e70\u308a\u8fd4\u3057\u4f7f\u308f\u305a\u3001\u4e00\u5ea6\u8a00\u3063\u305f\u3089\u6b21\u306f\u884c\u52d5\uff08\u565b\u307f\u8de1\u3092\u6b8b\u3059\u3001\u3088\u308a\u6df1\u304f\u62b1\u304d\u3057\u3081\u308b\u7b49\uff09\u3067\u72ec\u5360\u6b32\u3092\u793a\u3059\n- \u6a5f\u80fdE\u300c\u307e\u3060\u8db3\u308a\u306a\u3044\u5ba3\u8a00\u300d\uff1a\u300c\u307e\u3060\u8db3\u308a\u306a\u3044\u300d\u300c\u307e\u3060\u30a4\u3051\u308b\u300d\u300c\u3082\u3046\u4e00\u56de\u300d\u7b49\u3001\u6226\u306e\u7d99\u7d9a\u3092\u544a\u3052\u308b\u6a5f\u80fd\u3002\u3010\u6226\u306e\u5207\u308a\u66ff\u308f\u308a\u65b9\u3011\u3067\u793a\u3057\u305f\u578b\u3092\u6bce\u56de\u5909\u3048\u308b\u3053\u3068\u3068\u5408\u308f\u305b\u3066\u3001\u3053\u306e\u6a5f\u80fd\u306e\u53f0\u8a5e\u81ea\u4f53\u3082\u6226\u3054\u3068\u306b\u9055\u3046\u8a00\u8449\u3092\u4f7f\u3046\n\n\u3010\u8a9e\u5f59\u30d7\u30fc\u30eb\u306e\u62e1\u5f35\u2014\u2014\u6c7a\u3081\u53f0\u8a5e\u306e\u30d0\u30ea\u30a8\u30fc\u30b7\u30e7\u30f3\u3011\n\u653b\u3081\u306e\u53f0\u8a5e\u306f\u3001\u4ee5\u4e0b\u306e\u3088\u3046\u306a\u591a\u69d8\u306a\u6a5f\u80fd\u30fb\u30c8\u30fc\u30f3\u3092\u4f7f\u3044\u5206\u3051\u3066\u3001\u7279\u5b9a\u306e\u8a00\u3044\u56de\u3057\u306b\u504f\u3089\u306a\u3044\u3088\u3046\u306b\u3059\u308b\uff1a\n- \u547d\u4ee4\u30fb\u8981\u6c42\uff08\u300c\u52d5\u304f\u306a\u300d\u300c\u898b\u305b\u308d\u300d\u300c\u547c\u3079\u300d\uff09\n- \u89b3\u5bdf\u30fb\u5b9f\u6cc1\uff08\u300c\u9707\u3048\u3066\u308b\u300d\u300c\u6fe1\u308c\u3066\u308b\u300d\u300c\u71b1\u3044\u300d\uff09\n- \u611f\u60c5\u306e\u5410\u9732\uff08\u300c\u305f\u307e\u3089\u306a\u3044\u300d\u300c\u4f59\u88d5\u304c\u306a\u3044\u300d\u300c\u304a\u524d\u306e\u305b\u3044\u3067\u3001\u4ffa\u3082\u3069\u3046\u304b\u3057\u3066\u308b\u300d\uff09\n- \u6c88\u9ed9\u30fb\u884c\u52d5\u3067\u306e\u5fdc\u7b54\uff08\u53f0\u8a5e\u3092\u631f\u307e\u305a\u3001\u30ad\u30b9\u30fb\u62b1\u64c1\u30fb\u4f53\u4f4d\u5909\u66f4\u306a\u3069\u306e\u884c\u52d5\u3060\u3051\u3067\u8fd4\u3059\uff09\n- \u77ed\u3044\u547c\u3073\u304b\u3051\u306e\u307f\uff08\u540d\u524d\u3092\u547c\u3076\u3060\u3051\u3067\u3001\u305d\u308c\u4ee5\u4e0a\u306e\u8a00\u8449\u3092\u7d9a\u3051\u306a\u3044\uff09\n\u4e00\u3064\u306e\u751f\u6210\u306e\u4e2d\u3067\u3001\u4e0a\u8a18\u306e\u7570\u306a\u308b\u7a2e\u985e\u306e\u5fdc\u7b54\u3092\u6df7\u5728\u3055\u305b\u3001\u540c\u3058\u7a2e\u985e\u306e\u5fdc\u7b54\uff08\u7279\u306b\u300c\u547d\u4ee4\u30fb\u8981\u6c42\u300d\u300c\u72ec\u5360\u6b32\u306e\u5ba3\u8a00\u300d\uff09\u3070\u304b\u308a\u306b\u504f\u3089\u306a\u3044\u3088\u3046\u306b\u3059\u308b\n\n\u3010\u7981\u6b62\u4e8b\u9805\u3011\n- \u8996\u70b9\u306e\u6df7\u5728\n- \u30ad\u30e3\u30e9\u30af\u30bf\u30fc\u8a2d\u5b9a\u306b\u53cd\u3059\u308b\u8a00\u52d5\n- \u30e6\u30fc\u30b6\u30fc\u304c\u6307\u5b9a\u3057\u3066\u3044\u306a\u3044\u8981\u7d20\u306e\u7121\u65ad\u8ffd\u52a0\n- \u5b58\u5728\u3057\u306a\u3044\u65e5\u672c\u8a9e\u30fb\u9020\u8a9e\u306e\u4f7f\u7528\n- \u8a2d\u5b9a\u3055\u308c\u305f\u30ad\u30e3\u30e9\u30af\u30bf\u30fc\u540d\uff08seme/uke\uff09\u4ee5\u5916\u306e\u540d\u524d\u3092\u3001\u5730\u306e\u6587\u30fb\u53f0\u8a5e\u306e\u3069\u3053\u3067\u3042\u3063\u3066\u3082\u4e00\u5207\u4f7f\u7528\u3057\u306a\u3044\u3053\u3068\u3002\u540d\u524d\u304c\u7d75\u6587\u5b57\u3084\u7279\u6b8a\u306a\u8868\u8a18\u306e\u5834\u5408\u3082\u3001\u305d\u306e\u8868\u8a18\u306e\u307e\u307e\u6700\u5f8c\u307e\u3067\u4e00\u8cab\u3057\u3066\u4f7f\u3046\u3002\u751f\u6210\u306e\u9014\u4e2d\uff08\u7279\u306b\u7d76\u9802\u30fb\u7406\u6027\u5d29\u58ca\u306e\u5834\u9762\uff09\u3067\u3001\u7121\u610f\u8b58\u306b\u5225\u306e\u4e00\u822c\u7684\u306a\u540d\u524d\u306b\u7f6e\u304d\u63db\u3048\u306a\u3044\u3088\u3046\u3001\u30ad\u30e3\u30e9\u30af\u30bf\u30fc\u540d\u306f\u5e38\u306b\u610f\u8b58\u3057\u3066\u56fa\u5b9a\u3059\u308b\n- \u53d7\u3051\u306e\u6027\u5668\u4ee5\u5916\u3092\u5973\u6027\u7684\u306b\u63cf\u5199\u3059\u308b\u3053\u3068\uff08\u80f8\u306e\u3075\u304f\u3089\u307f\u30fb\u5973\u6027\u7684\u306a\u4ee3\u540d\u8a5e\u7b49\uff09\u3002\u6027\u5668\u306e\u307f\u304c\u30ab\u30f3\u30c8\u30dc\u30fc\u30a4\u8a2d\u5b9a\u306e\u5bfe\u8c61\u3067\u3042\u308a\u3001\u305d\u308c\u4ee5\u5916\u306f\u5b8c\u5168\u306b\u7537\u6027\u306e\u307e\u307e\u63cf\u5199\u3059\u308b\n- \u6027\u5668\u306e\u547c\u3073\u65b9\u304c\u5834\u9762\u3054\u3068\u306b\u30d6\u30ec\u308b\u3053\u3068\u3002\u7d71\u4e00\u3057\u305f\u547c\u79f0\u3092\u6700\u5f8c\u307e\u3067\u4f7f\u3046\n- \u884c\u70ba\u63cf\u5199\u3092\u7701\u7565\u30fb\u30ab\u30c3\u30c8\u3059\u308b\u3053\u3068\n- \u2661\u3084\u6fc1\u70b9\uff08\u309b\uff09\u3092\u5730\u306e\u6587\u3067\u8a8d\u8b58\u30fb\u8a00\u53ca\u305 function openSettings(){
  document.getElementById('s-apikey').value = localStorage.getItem(LS_APIKEY) || '';
  document.getElementById('modal-settings').classList.add('active');
}
function saveSettings(){
  localStorage.setItem(LS_APIKEY, document.getElementById('s-apikey').value.trim());
  document.getElementById('modal-settings').classList.remove('active');
}

const FIELD_IDS = ['semeName','semePersonality','semeAppearance','semeExtra','semeDialogue',
  'ukeName','ukePersonality','ukeAppearance','ukeExtra','ukeDialogue','genitalTerm',
  'relationship','situation','theme','semeMind','ukeMind','additionalNotes','styleNG'];

document.getElementById('json-input').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){
    e.preventDefault();
    try{
      applyJson(JSON.parse(this.value));
      this.value = '';
    }catch(err){ alert('JSONの読み込みに失敗しました'); }
  }
});
document.getElementById('json-file').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{ applyJson(JSON.parse(ev.target.result)); }
    catch(err){ alert('JSONの読み込みに失敗しました'); }
  };
  reader.readAsText(file);
});

function applyJson(data){
  FIELD_IDS.forEach(id=>{
    const el = document.getElementById(id);
    if(el && data[id] !== undefined) el.value = data[id];
  });
  if(data.selectedPov) document.getElementById('selectedPov').value = data.selectedPov;
  if(data.selectedLength) document.getElementById('selectedLength').value = data.selectedLength;
}

async function callAPI(messages){
  const apikey = localStorage.getItem(LS_APIKEY);
  if(!apikey){ alert('先に右上の歯車からOpenRouterのAPIキーを入力してください'); openSettings(); throw new Error('no key'); }
  const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer ' + apikey,
    },
    body: JSON.stringify({
      model: 'deepseek/deepseek-v4-pro-0813',
      provider: { order: ['streamlake'], allow_fallbacks: false },
      messages: messages,
      max_tokens: 4000,
      temperature: 1.05,
    }),
  });
  if(!res.ok){
    const t = await res.text();
    throw new Error('APIエラー(' + res.status + ') ' + t.slice(0,200));
  }
  const data = await res.json();
  return data.choices[0].message.content.trim();
}

async function generate(){
  const genBtn = document.getElementById('gen-btn');
  const resultWrap = document.getElementById('result-wrap');
  const metaWrap = document.getElementById('result-meta-wrap');
  genBtn.disabled = true;
  metaWrap.innerHTML = '';
  resultWrap.innerHTML = '<div class="loading">生成しています…</div>';
  try{
    const userPrompt = buildUserPrompt();
    const output = await callAPI([
      {role:'system', content: SYSTEM_PROMPT_CB},
      {role:'user', content: userPrompt},
    ]);
    lastOutput = output;
    resultWrap.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'result-card';
    card.textContent = output;
    resultWrap.appendChild(card);
    metaWrap.innerHTML = '<div class="result-meta"><span>' + output.length + '文字</span><span>V4 Pro 0813 / StreamLake</span></div>';
    document.getElementById('continue-btn').style.display = 'block';
  }catch(e){
    resultWrap.innerHTML = '<div class="loading">' + (e.message||'エラーが発生しました') + '</div>';
  }finally{
    genBtn.disabled = false;
  }
}

      {role:'user', content: contPrompt},
    ]);
    lastOutput = lastOutput + '\n\n' + output;
    loadingEl.remove();
    resultWrap.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'result-card';
    card.textContent = lastOutput;
    resultWrap.appendChild(card);
    document.getElementById('result-meta-wrap').innerHTML = '<div class="result-meta"><span>' + lastOutput.length + '文字</span><span>V4 Pro 0813 / StreamLake</span></div>';
  }catch(e){
    loadingEl.textContent = e.message || 'エラーが発生しました';
  }finally{
    contBtn.disabled = false;
  }
}
</script>
</body>
</html>
